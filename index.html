<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF8F5">
<title>Runs &amp; Walks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5; --surface:#FFFFFF; --charcoal:#2A2724; --muted:#8A8177; --border:#E8E2D9;
  --clay:#C4694A; --clay-l:#EBD3C7; --teal:#3E7C74; --teal-l:#CFE1DD; --slate:#5B6E8C; --slate-l:#D9DEE7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Albert Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--charcoal);
  max-width:560px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer}

.header{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px}
.header-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.vbadge{font-size:10px;font-weight:700;color:var(--muted);background:var(--border);padding:2px 6px;border-radius:999px;vertical-align:middle;margin-left:2px}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:0}
.icon-btn.danger{color:var(--clay)}
.icon-btn svg{width:16px;height:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);color:var(--charcoal);font-size:14px;font-weight:600}
.btn-primary{background:var(--charcoal);color:var(--bg);border-color:var(--charcoal)}
.btn:disabled{opacity:.4}
.link-btn{background:none;border:none;padding:0;color:var(--slate);font-size:12px;font-weight:600;text-decoration:underline}

.sync-bar{margin:0 16px 10px;padding:9px 12px;border-radius:10px;font-size:12.5px;display:flex;
  align-items:center;justify-content:space-between;gap:10px;background:var(--border);color:var(--charcoal)}
.sync-bar.ok{background:var(--teal-l);color:var(--teal)}
.sync-bar.warn{background:var(--clay-l);color:var(--clay)}
.sync-bar button{background:currentColor;border:none;color:#fff;font-size:11.5px;font-weight:700;
  padding:6px 12px;border-radius:999px;flex:0 0 auto}
.sync-bar .txt{flex:1;min-width:0}

.panel{margin:0 16px 12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.panel.alert{border-color:var(--clay);border-width:1.5px}
.panel p.sub{font-size:12px;color:var(--muted);line-height:1.5}
.panel code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:11px}
.field{width:100%;margin-top:8px;padding:11px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--charcoal);font-size:14px;font-family:ui-monospace,Menlo,monospace}
textarea.field{resize:vertical;min-height:90px;font-size:12px}
.row-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.row-actions.left{justify-content:flex-start}
.status{margin-top:10px;font-size:12px;padding:8px 10px;border-radius:8px}
.status.ok{background:var(--teal-l);color:var(--teal)}
.status.err{background:var(--clay-l);color:var(--clay)}

.chip-row{display:flex;gap:6px;padding:4px 16px 10px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);font-size:12.5px;font-weight:600}
.chip.active{background:var(--charcoal);color:var(--bg);border-color:var(--charcoal)}

.view{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.stat-v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.stat-l{font-size:11.5px;color:var(--muted);font-weight:500}
.card-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
.card-head .sub{color:var(--muted);font-weight:500;font-size:12px}
.cap{font-size:11px;color:var(--muted);margin-top:6px}
.muted-note{color:var(--muted);font-size:13px;text-align:center;padding:18px 8px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;border:1.5px solid;
  background:transparent;font-size:11px;font-weight:700}

.arow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--border)}
.arow:first-child{border-top:none}
.arow .main{display:flex;flex-direction:column;gap:4px;min-width:80px}
.arow .date{font-size:12px;font-weight:600}
.arow .stats{display:flex;gap:10px;flex:1;font-size:12px;flex-wrap:wrap}
.arow .del{background:none;border:none;color:var(--muted);padding:6px;display:flex}
.arow .del.confirm{color:var(--clay);font-size:10.5px;font-weight:700}

.sel-wrap{position:relative}
select.sel{width:100%;appearance:none;-webkit-appearance:none;padding:11px 34px 11px 12px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:600;color:var(--charcoal)}
.sel-wrap::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;pointer-events:none;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}

.dstats{display:flex;justify-content:space-between;margin-top:12px}
.dstats .v{font-size:17px;font-weight:700}
.dstats .l{font-size:10.5px;color:var(--muted)}
.dstats2{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}

.prgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr .v{font-size:16px;font-weight:700;margin-top:2px}
.pr .l{font-size:10.5px;color:var(--muted)}
.pr .s{font-size:10px;color:var(--muted)}

.splitbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--border)}
.legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 24px 20px}
.empty h2{font-size:17px;font-weight:700}
.empty p{font-size:13px;color:var(--muted);max-width:330px;line-height:1.55}

.tabbar{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:560px;background:var(--surface);
  border-top:1px solid var(--border);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
  color:var(--muted);padding:6px 0;border-radius:10px;font-size:10.5px;font-weight:600}
.tab.active{color:var(--charcoal);background:var(--bg)}
.tab svg{width:19px;height:19px}

.hidden-input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tip{background:var(--charcoal);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:11.5px;
  position:fixed;pointer-events:none;z-index:50;opacity:0;transition:opacity .12s;max-width:210px;
  line-height:1.4;white-space:pre-line}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{transition:opacity .15s}
.metgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.met{background:var(--bg);border-radius:10px;padding:10px}
.met .v{font-size:16px;font-weight:700}
.met .l{font-size:10.5px;color:var(--muted)}
.met .h{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.places{display:flex;flex-wrap:wrap;gap:7px}
.place-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;
  background:var(--bg);border:1px solid var(--border);font-size:12px;font-weight:600}
.place-chip .n{color:var(--muted);font-weight:500;font-size:11px}
.country-row{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.country-row .flag{font-size:19px}
.country-row .name{font-size:13px;font-weight:700}
.country-row .cnt{font-size:11px;color:var(--muted)}
.arow .place{font-size:10px;color:var(--muted)}
svg{display:block;max-width:100%}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">Runs &amp; Walks <span class="vbadge" id="ver"></span></div>
  <div class="header-actions">
    <button class="icon-btn" id="btnExport" title="Export backup" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="icon-btn" id="btnClear" title="Clear all data" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
    <label class="icon-btn" for="fileInput" title="Upload activities">
      <svg id="upIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </label>
  </div>
  <input id="fileInput" type="file" multiple class="hidden-input">
</div>

<div id="syncBar"></div>
<div id="toast"></div>
<div id="dupes"></div>
<div id="pending"></div>
<div id="clearPanel"></div>
<div id="dbxPanel"></div>
<div id="pastePanel"></div>

<div style="padding:0 16px 8px;display:flex;gap:14px;flex-wrap:wrap">
  <button class="link-btn" id="linkDbx">Dropbox sync</button>
  <button class="link-btn" id="linkPaste">Paste a file instead</button>
</div>

<div id="chips"></div>
<div id="main"></div>

<div class="tabbar" id="tabbar"></div>
<div class="tip" id="tip"></div>

<script>
/* ===========================================================================
   Runs & Walks — single-file build for GitHub Pages.
   Data lives in Dropbox (via OAuth2 PKCE, no server, no app secret) with
   localStorage as an offline cache. Nothing is sent anywhere else.
   =========================================================================== */
const APP_VERSION="v3.3";
document.getElementById("ver").textContent = APP_VERSION;

/* ---------------- constants ---------------- */
const RUN="Running", WALK="Walking", BIKE="Biking", OTHER="Other";
const SPORT_ORDER=[RUN,WALK,BIKE,OTHER];
const SPORT_COLOR={Running:"#C4694A",Walking:"#3E7C74",Biking:"#5B6E8C",Other:"#8A8177"};
const C={bg:"#FAF8F5",surface:"#FFFFFF",charcoal:"#2A2724",muted:"#8A8177",border:"#E8E2D9",
  clay:"#C4694A",clayL:"#EBD3C7",teal:"#3E7C74",tealL:"#CFE1DD",slate:"#5B6E8C",slateL:"#D9DEE7",amber:"#C89A3C",plum:"#7A5570"};
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LS_INDEX="rw:index", LS_PTS="rw:pts:", LS_DBX="rw:dbx", LS_BACKUP="rw:lastbackup", LS_DEL="rw:deleted", LS_RES="rw:restored";
const DBX_FILE="/runs-and-walks.json";

/* ---------------- state ---------------- */
let state={
  index:[], deleted:{}, restored:{}, showClear:false, dupes:[],
  tab:"overview", sportFilter:"all", range:"all", geoBusy:false, trendMetric:"pace",
  selectedId:null, year:null, pending:[], pointsCache:{},
  dbx:{appKey:"",refresh:null,account:null}, syncMsg:null, syncing:false,
  showDbx:false, showPaste:false, dbxStatus:null, backedUp:[],
  confirmClear:false, confirmDel:null, exportText:null,
};

/* ---------------- tiny helpers ---------------- */
const $=id=>document.getElementById(id);
const el=(tag,attrs,...kids)=>{
  const n=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(v==null||v===false) continue;
    if(k==="class") n.className=v;
    else if(k==="html") n.innerHTML=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="style" && typeof v==="object") Object.assign(n.style,v);
    else n.setAttribute(k,v===true?"":v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false)return; n.appendChild(typeof c==="object"?c:document.createTextNode(String(c))); });
  return n;
};
const svgEl=(tag,attrs)=>{const n=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in attrs){ if(attrs[k]!=null) n.setAttribute(k,attrs[k]); } return n;};

function kid(e,t){ if(!e||!e.children)return null; for(let i=0;i<e.children.length;i++) if(e.children[i].tagName===t) return e.children[i]; return null; }
function kidText(e,t){const c=kid(e,t);return c?c.textContent.trim():"";}
function deepLocal(e,ln){if(!e)return null;const all=e.getElementsByTagName("*");
  for(let i=0;i<all.length;i++){if(all[i].tagName.split(":").pop()===ln)return all[i];}return null;}
function numOf(e,ln){const n=deepLocal(e,ln);if(!n)return NaN;const v=parseFloat(n.textContent);return isNaN(v)?NaN:v;}
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
/* Garmin names its exports activity_<id>.tcx — that number identifies the
   activity itself and survives trimming or re-editing, so it is the most
   reliable thing to match on. Timestamps are the fallback. */
function garminIdFrom(fileName){
  const m=/(?:activity[_-])?(\d{8,})/i.exec(String(fileName||""));
  return m?m[1]:null;
}
/* Layered duplicate check:
     same     — provably the same activity, safe to refresh in place
     probable — looks like the same run, nothing definitive matches, so ask
     null     — new */
function findDuplicate(sum){
  for(const a of state.index){
    if(a.id===sum.id)return {kind:"same",existing:a,why:"same start time"};
    if(sum.garminId&&a.garminId&&a.garminId===sum.garminId)
      return {kind:"same",existing:a,why:"same Garmin activity number"};
    if(sum.tcxId&&a.tcxId&&a.tcxId===sum.tcxId)
      return {kind:"same",existing:a,why:"same activity id"};
  }
  for(const a of state.index){
    const dt=Math.abs(new Date(a.startTime)-new Date(sum.startTime))/60000;
    if(dt>30)continue;
    const dd=a.distanceKm?Math.abs(a.distanceKm-sum.distanceKm)/a.distanceKm:1;
    const du=a.durationSec?Math.abs(a.durationSec-sum.durationSec)/a.durationSec:1;
    if(dd<=0.05&&du<=0.05){
      const bits=[dt<1?"starts within a minute":`starts ${Math.round(dt)} min apart`,
        `${(dd*100).toFixed(1)}% apart in distance`];
      return {kind:"probable",existing:a,why:bits.join(", ")};
    }
  }
  return null;
}
function countryFlag(code){if(!code||code.length!==2)return "\u{1F30D}";
  return String.fromCodePoint(...[...code.toUpperCase()].map(c=>127397+c.charCodeAt(0)));}

function fmtKm(km,d=2){return km==null||isNaN(km)?"—":km.toFixed(d)+" km";}
/* Round to whole seconds BEFORE splitting, otherwise 299.7s formats as "4:60". */
function fmtDur(s){if(s==null||isNaN(s)||s<=0)return "—";
  const t=Math.round(s),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),x=t%60;
  return h>0?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`;}
function fmtPace(p){if(!p||!isFinite(p)||p<=0)return "—";
  const t=Math.round(p);return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}/km`;}
function fmtPaceShort(p){if(p==null||isNaN(p))return "";
  const t=Math.round(p);return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;}
function fmtDateShort(iso){const d=new Date(iso);return isNaN(d)?"—":`${d.getDate()} ${MONTHS[d.getMonth()]}`;}
function fmtDateLong(iso){const d=new Date(iso);return isNaN(d)?"—":`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;}

function haversineKm(a1,o1,a2,o2){const R=6371,dLa=(a2-a1)*Math.PI/180,dLo=(o2-o1)*Math.PI/180;
  const x=Math.sin(dLa/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function elevGain(pts){const al=pts.map(p=>p.a).filter(a=>a!=null&&!isNaN(a));
  if(al.length<2)return null;
  const sm=al.length>=20?al.map((_,i)=>{let s=0,c=0;for(let j=Math.max(0,i-2);j<=Math.min(al.length-1,i+2);j++){s+=al[j];c++;}return s/c;}):al;
  let g=0;for(let i=1;i<sm.length;i++){const d=sm[i]-sm[i-1];if(d>0)g+=d;}return Math.round(g);}
/* Auto-pause leaves literal gaps in the trackpoint stream — the watch stops
   recording while you stand still. Raw elapsed time therefore includes every
   traffic light, which inflates split paces. Collapsing gaps longer than
   PAUSE_GAP reproduces Garmin's own moving time to within a few seconds, so
   splits, decoupling and route pace agree with the headline figure.
   Idempotent: a second pass finds nothing left to collapse. */
const PAUSE_GAP=5;
function normalizeMovingTime(points){
  let shift=0,prev=null;
  for(const pt of points){
    if(pt.t==null)continue;
    if(prev!=null){
      const gap=pt.t-prev;
      if(gap>PAUSE_GAP)shift+=gap-1;   // leave 1s so samples still advance
    }
    prev=pt.t;
    pt.t=pt.t-shift;
  }
  return points;
}
function stoppedSeconds(points){
  let stopped=0,prev=null;
  for(const pt of points){
    if(pt.t==null)continue;
    if(prev!=null&&pt.t-prev>PAUSE_GAP)stopped+=(pt.t-prev)-1;
    prev=pt.t;
  }
  return stopped;
}
function downsample(p,m){if(p.length<=m)return p;const s=Math.ceil(p.length/m);return p.filter((_,i)=>i%s===0);}

/* ---------------- parsing ---------------- */
function parseTCX(text,fileName){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("could not be read as TCX");
  const acts=Array.from(doc.getElementsByTagName("Activity"));
  if(!acts.length) throw new Error("no activity found in this TCX file");
  return acts.map(act=>{
    const sportRaw=act.getAttribute("Sport")||OTHER;
    const laps=Array.from(act.getElementsByTagName("Lap")).filter(l=>l.parentNode===act);
    let cal=0,hasCal=false,hrW=0,hrWt=0,maxL=0,hasLapHR=false,start=null;
    const pts=[];
    laps.forEach(lap=>{
      const dur=parseFloat(kidText(lap,"TotalTimeSeconds"))||0;
      const c=parseFloat(kidText(lap,"Calories")); if(!isNaN(c)){cal+=c;hasCal=true;}
      const av=kid(lap,"AverageHeartRateBpm");
      if(av){const v=parseFloat(kidText(av,"Value"));if(!isNaN(v)){hrW+=v*dur;hrWt+=dur;hasLapHR=true;}}
      const mx=kid(lap,"MaximumHeartRateBpm");
      if(mx){const v=parseFloat(kidText(mx,"Value"));if(!isNaN(v))maxL=Math.max(maxL,v);}
      Array.from(lap.getElementsByTagName("Track")).forEach(tr=>{
        Array.from(tr.getElementsByTagName("Trackpoint")).forEach(tp=>{
          const ts=kidText(tp,"Time"), t=ts?new Date(ts):null, ok=t&&!isNaN(t);
          if(ok&&!start)start=t;
          const pos=kid(tp,"Position");
          const la=pos?parseFloat(kidText(pos,"LatitudeDegrees")):NaN;
          const lo=pos?parseFloat(kidText(pos,"LongitudeDegrees")):NaN;
          const a=parseFloat(kidText(tp,"AltitudeMeters"));
          const d=parseFloat(kidText(tp,"DistanceMeters"));
          const he=kid(tp,"HeartRateBpm");
          const h=he?parseFloat(kidText(he,"Value")):NaN;
          /* Garmin puts speed/cadence/power in TCX extensions. Vertical
             oscillation, vertical ratio and ground contact are FIT-only. */
          const ext=kid(tp,"Extensions");
          const sp=ext?numOf(ext,"Speed"):NaN;
          const cd=ext?numOf(ext,"RunCadence"):NaN;
          const wt=ext?numOf(ext,"Watts"):NaN;
          pts.push({t:ok&&start?(t-start)/1000:null,d:isNaN(d)?null:d/1000,
            la:isNaN(la)?null:la,lo:isNaN(lo)?null:lo,a:isNaN(a)?null:a,h:isNaN(h)?null:h,
            s:isNaN(sp)?null:sp,c:isNaN(cd)?null:cd*2,w:isNaN(wt)?null:wt});
        });
      });
    });
    if(!pts.length) throw new Error("no trackpoints found in this TCX activity");
    const stoppedSec=stoppedSeconds(pts);
    normalizeMovingTime(pts);
    let last=0; for(const p of pts){ if(p.d==null)p.d=last; else last=p.d; }
    const lapSum=laps.reduce((s,l)=>s+(parseFloat(kidText(l,"TotalTimeSeconds"))||0),0);
    const span=pts.filter(p=>p.t!=null).slice(-1)[0]?.t||0;
    const durationSec=lapSum>0?lapSum:span;
    const km=Math.max(...pts.map(p=>p.d||0));
    const hrs=pts.map(p=>p.h).filter(h=>h!=null);
    const eg=elevGain(pts);
    const sum={
      id:(start||new Date()).toISOString().replace(/[^0-9]/g,""),
      source:"tcx",fileName,startTime:(start||new Date()).toISOString(),
      garminId:garminIdFrom(fileName),tcxId:kidText(act,"Id")||null,
      sport:sportRaw===RUN?RUN:sportRaw===BIKE?BIKE:OTHER,
      sportSource:sportRaw===OTHER?"unset":"file",
      distanceKm:km,durationSec,elevGainM:eg,
      avgPaceSecPerKm:km>0?durationSec/km:null,
      calories:hasCal?Math.round(cal):null,
      avgHR:hasLapHR?Math.round(hrW/hrWt):(hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):null),
      maxHR:maxL||(hrs.length?Math.max(...hrs):null),
      hasHR:hrs.length>0||hasLapHR,hasElevation:eg!=null,hasGPS:pts.some(p=>p.la!=null),
      stoppedSec:Math.round(stoppedSec),
    };
    Object.assign(sum,deriveMetrics(pts,sum));

  });
}
function parseGPX(text,fileName){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("could not be read as GPX");
  const trks=Array.from(doc.getElementsByTagName("trk"));
  if(!trks.length) throw new Error("no track found in this GPX file");
  return trks.map(trk=>{
    let sportRaw=OTHER; const te=kid(trk,"type");
    if(te){const t=te.textContent.trim().toLowerCase();
      if(t.includes("run"))sportRaw=RUN; else if(t.includes("walk")||t.includes("hik"))sportRaw=WALK;
      else if(t.includes("bik")||t.includes("cycl"))sportRaw=BIKE;}
    const raw=[];
    Array.from(trk.getElementsByTagName("trkseg")).forEach(seg=>{
      Array.from(seg.getElementsByTagName("trkpt")).forEach(pt=>{
        const la=parseFloat(pt.getAttribute("lat")),lo=parseFloat(pt.getAttribute("lon"));
        const ee=kid(pt,"ele"), a=ee?parseFloat(ee.textContent):NaN;
        const t2=kid(pt,"time"), t=t2?new Date(t2.textContent):null;
        const ex=kid(pt,"extensions");
        const hv=ex?numOf(ex,"hr"):NaN;
        const cv=ex?numOf(ex,"cad"):NaN;
        raw.push({la,lo,a:isNaN(a)?null:a,t:t&&!isNaN(t)?t:null,
          h:isNaN(hv)?null:hv,c:isNaN(cv)?null:cv*2});
      });
    });
    if(!raw.length) throw new Error("no track points found in this GPX file");
    let start=null,cum=0,pLa=null,pLo=null,prevT=null,prevCum=0;
    const pts=raw.map(p=>{
      if(p.t&&!start)start=p.t;
      if(pLa!=null&&!isNaN(p.la))cum+=haversineKm(pLa,pLo,p.la,p.lo);
      if(!isNaN(p.la)){pLa=p.la;pLo=p.lo;}
      const tS=p.t&&start?(p.t-start)/1000:null;
      let sp=null;
      if(tS!=null&&prevT!=null&&tS>prevT)sp=(cum-prevCum)*1000/(tS-prevT);
      if(tS!=null){prevT=tS;prevCum=cum;}
      return {t:tS,d:cum,la:isNaN(p.la)?null:p.la,lo:isNaN(p.lo)?null:p.lo,
        a:p.a,h:p.h,c:p.c,s:sp,w:null};
    });
    const gpxStopped=stoppedSeconds(pts);
    normalizeMovingTime(pts);
    const dur=pts.filter(p=>p.t!=null).slice(-1)[0]?.t||0;
    const hrs=pts.map(p=>p.h).filter(h=>h!=null);
    const eg=elevGain(pts);
    const sum={
      id:(start||new Date()).toISOString().replace(/[^0-9]/g,""),
      source:"gpx",fileName,startTime:(start||new Date()).toISOString(),
      garminId:garminIdFrom(fileName),tcxId:null,
      sport:sportRaw,sportSource:sportRaw===OTHER?"unset":"file",
      distanceKm:cum,durationSec:dur,elevGainM:eg,
      avgPaceSecPerKm:cum>0?dur/cum:null,calories:null,
      avgHR:hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):null,
      maxHR:hrs.length?Math.max(...hrs):null,
      hasHR:hrs.length>0,hasElevation:eg!=null,hasGPS:pts.some(p=>p.la!=null),
      stoppedSec:Math.round(gpxStopped),
    };
    Object.assign(sum,deriveMetrics(pts,sum));
    return {summary:sum,points:pts};
  });
}

/* ---- derived running metrics, all from data actually in the file ---- */
function deriveMetrics(pts,sum){
  const out={};
  const moving=pts.filter(p=>p.s!=null&&p.s>0.5);
  const cads=moving.map(p=>p.c).filter(c=>c!=null&&c>0);
  const wats=moving.map(p=>p.w).filter(w=>w!=null&&w>0);
  out.avgCadence=cads.length?Math.round(mean(cads)):null;
  out.maxCadence=cads.length?Math.round(Math.max(...cads)):null;
  out.avgPower=wats.length?Math.round(mean(wats)):null;
  out.maxPower=wats.length?Math.round(Math.max(...wats)):null;
  const steps=moving.filter(p=>p.c>0).map(p=>p.s/(p.c/60));
  out.avgStepLen=steps.length?+mean(steps).toFixed(2):null;
  if(sum.avgHR&&sum.distanceKm&&sum.durationSec){
    const mPerMin=(sum.distanceKm*1000)/(sum.durationSec/60);
    out.efficiencyIndex=+(mPerMin/sum.avgHR).toFixed(2);
  }else out.efficiencyIndex=null;
  const wb=pts.filter(p=>p.h!=null&&p.s!=null&&p.s>0.5&&p.t!=null);
  if(wb.length>60){
    const mid=wb[Math.floor(wb.length/2)].t;
    const ef=arr=>{const a=mean(arr.map(p=>p.s)),b=mean(arr.map(p=>p.h));return a&&b?a/b:null;};
    const e1=ef(wb.filter(p=>p.t<=mid)),e2=ef(wb.filter(p=>p.t>mid));
    out.decouplingPct=(e1&&e2)?+(((e1-e2)/e1)*100).toFixed(1):null;
  }else out.decouplingPct=null;
  const timed=pts.filter(p=>p.t!=null&&p.d!=null);
  if(timed.length>10){
    const total=timed[timed.length-1].d,half=total/2;
    const idx=timed.findIndex(p=>p.d>=half);
    if(idx>0){
      const t1=timed[idx].t-timed[0].t,d1=timed[idx].d-timed[0].d;
      const t2=timed[timed.length-1].t-timed[idx].t,d2=total-timed[idx].d;
      if(d1>0&&d2>0)out.negSplitSec=+((t1/d1)-(t2/d2)).toFixed(1);
    }
  }
  const g=pts.find(p=>p.la!=null&&p.lo!=null);
  if(g){out.startLat=+g.la.toFixed(5);out.startLon=+g.lo.toFixed(5);}
  return out;
}

/* ---------------- derived ---------------- */
function splitsOf(points){
  const pts=points.filter(p=>p.d!=null&&p.t!=null);
  if(pts.length<2)return [];
  const out=[];let next=1,lastT=pts[0].t,lastD=pts[0].d,lastI=0;
  for(let i=1;i<pts.length;i++){
    const p0=pts[i-1],p1=pts[i];
    while(p1.d>=next&&p0.d<next){
      const f=(next-p0.d)/(p1.d-p0.d||1e-6);
      const tAt=p0.t+f*(p1.t-p0.t);
      const seg=pts.slice(lastI,i+1);
      out.push({label:String(next),sec:tAt-lastT,
        hr:mean(seg.map(p=>p.h).filter(x=>x!=null)),
        cad:mean(seg.map(p=>p.c).filter(x=>x!=null&&x>0)),
        pw:mean(seg.map(p=>p.w).filter(x=>x!=null&&x>0)),
        elev:elevGain(seg)});
      lastT=tAt;lastD=next;lastI=i;next+=1;
    }
  }
  const L=pts[pts.length-1];
  if(L.d-lastD>0.15){
    const seg=pts.slice(lastI);
    out.push({label:L.d.toFixed(1),sec:L.t-lastT,partial:true,
      hr:mean(seg.map(p=>p.h).filter(x=>x!=null)),
      cad:mean(seg.map(p=>p.c).filter(x=>x!=null&&x>0)),
      pw:mean(seg.map(p=>p.w).filter(x=>x!=null&&x>0)),elev:elevGain(seg)});
  }
  return out;
}
function weeklyOf(list){
  const m=new Map();
  list.forEach(a=>{
    const d=new Date(a.startTime),dt=new Date(d);
    dt.setDate(dt.getDate()-((dt.getDay()+6)%7));dt.setHours(0,0,0,0);
    const k=dt.toISOString().slice(0,10);
    if(!m.has(k))m.set(k,{key:k,label:fmtDateShort(dt),km:0,n:0,sec:0});
    const e=m.get(k);e.km+=a.distanceKm;e.n++;e.sec+=a.durationSec;
  });
  return Array.from(m.values()).sort((a,b)=>a.key.localeCompare(b.key));
}
/* rolling average over the last n activities, chronological */
function rolling(list,key,n=5){
  const asc=[...list].sort((a,b)=>new Date(a.startTime)-new Date(b.startTime))
    .filter(a=>a[key]!=null&&!isNaN(a[key]));
  return asc.map((a,i)=>({label:fmtDateShort(a.startTime),
    v:mean(asc.slice(Math.max(0,i-n+1),i+1).map(x=>x[key]))}));
}
/* group activities into countries -> places */
function placesOf(list){
  const byC=new Map();
  list.forEach(a=>{
    if(!a.place&&!a.country)return;
    const ck=a.countryCode||a.country||"??";
    if(!byC.has(ck))byC.set(ck,{code:a.countryCode,country:a.country||"Unknown",places:new Map(),n:0,km:0});
    const c=byC.get(ck);c.n++;c.km+=a.distanceKm;
    const nm=a.place||"—";
    if(!c.places.has(nm))c.places.set(nm,{name:nm,n:0,km:0});
    const pe=c.places.get(nm);pe.n++;pe.km+=a.distanceKm;
  });
  return Array.from(byC.values())
    .map(c=>({...c,places:Array.from(c.places.values()).sort((a,b)=>b.n-a.n)}))
    .sort((a,b)=>b.n-a.n);
}
function monthlyOf(list,year){
  const out=MONTHS.map((label,i)=>({label,month:i,km:0,n:0,sec:0,Running:0,Walking:0,Biking:0,Other:0}));
  list.forEach(a=>{const d=new Date(a.startTime);if(d.getFullYear()!==year)return;
    const m=out[d.getMonth()];m.km+=a.distanceKm;m.n++;m.sec+=a.durationSec;m[a.sport]+=a.distanceKm;});
  return out;
}
function filtered(){
  return state.sportFilter==="all"?state.index:state.index.filter(a=>a.sport===state.sportFilter);
}
function years(){
  return Array.from(new Set(state.index.map(a=>new Date(a.startTime).getFullYear()))).sort((a,b)=>b-a);
}

/* ---------------- charts (hand-rolled SVG) ---------------- */
const tipEl=$("tip");
function showTip(e,text){
  tipEl.textContent=text; tipEl.style.opacity="1";
  const x=(e.touches?e.touches[0].clientX:e.clientX), y=(e.touches?e.touches[0].clientY:e.clientY);
  tipEl.style.left=Math.min(x+10,window.innerWidth-140)+"px";
  tipEl.style.top=Math.max(y-42,6)+"px";
}
function hideTip(){tipEl.style.opacity="0";}
function bindTip(node,text){
  node.addEventListener("pointerenter",e=>showTip(e,text));
  node.addEventListener("pointerdown",e=>showTip(e,text));
  node.addEventListener("pointerleave",hideTip);
  node.style.cursor="pointer";
}
const S=svgEl;
const W=520;
function gridY(svg,{PL,PR,PT,IH,min,max,fmt}){
  [0,.25,.5,.75,1].forEach(f=>{
    const val=min+(max-min)*f,y=PT+IH-f*IH;
    svg.appendChild(S("line",{x1:PL,y1:y,x2:W-PR,y2:y,stroke:C.border,"stroke-width":f===0?1.5:1}));
    svg.appendChild(txt(S("text",{x:PL-6,y:y+3,"text-anchor":"end","font-size":10,fill:C.muted}),fmt(val)));
  });
}
const txt=(node,t)=>{node.textContent=t;return node;};

/* Bubble timeline: x=date, y=metric, r=distance, colour=sport */
function bubbleTimeline(items,{h=210,yOf,yFmt,yLabel,invert=false,rOf,tip}={}){
  const PL=40,PR=14,PT=14,PB=24,IH=h-PT-PB,IW=W-PL-PR;
  const svg=S("svg",{viewBox:`0 0 ${W} ${h}`,width:"100%",height:h});
  const vals=items.map(yOf).filter(v=>v!=null&&!isNaN(v));
  if(!vals.length)return svg;
  let min=Math.min(...vals),max=Math.max(...vals);
  if(min===max){min-=1;max+=1;}
  const pad=(max-min)*.18;min-=pad;max+=pad;
  const ys=v=>{const f=(v-min)/(max-min);return PT+IH-(invert?1-f:f)*IH;};
  gridY(svg,{PL,PR,PT,IH,min,max,fmt:yFmt});
  const times=items.map(a=>new Date(a.startTime).getTime());
  const t0=Math.min(...times),t1=Math.max(...times);
  const xs=t=>PL+(t1===t0?IW/2:((t-t0)/(t1-t0))*IW);
  const rs=items.map(rOf).filter(v=>v!=null);const rMax=rs.length?Math.max(...rs):1;
  const path=items.map((a,i)=>{const v=yOf(a);if(v==null)return null;
    return `${i?"L":"M"}${xs(times[i]).toFixed(1)},${ys(v).toFixed(1)}`;}).filter(Boolean).join(" ");
  if(items.length>1)svg.appendChild(S("path",{d:path,fill:"none",stroke:C.border,"stroke-width":1.5,"stroke-dasharray":"3 4"}));
  items.forEach((a,i)=>{
    const v=yOf(a);if(v==null||isNaN(v))return;
    const r=4+Math.sqrt((rOf(a)||0)/rMax)*13;
    const col=SPORT_COLOR[a.sport]||C.slate;
    const c=S("circle",{cx:xs(times[i]),cy:ys(v),r,fill:col,"fill-opacity":.42,stroke:col,"stroke-width":1.6,class:"bubble"});
    bindTip(c,tip(a));svg.appendChild(c);
  });
  const step=Math.max(1,Math.ceil(items.length/5));
  items.forEach((a,i)=>{if(i%step===0)
    svg.appendChild(txt(S("text",{x:xs(times[i]),y:h-7,"text-anchor":"middle","font-size":10,fill:C.muted}),
      fmtDateShort(a.startTime)));});
  if(yLabel)svg.appendChild(txt(S("text",{x:PL-6,y:PT-4,"text-anchor":"end","font-size":9,fill:C.muted}),yLabel));
  return svg;
}

/* Free x/y bubble scatter */
function bubbleScatter(items,{h=220,xOf,yOf,rOf,xFmt,yFmt,xLabel,yLabel,invertY=false,tip}={}){

/* Distribution strip — where the time actually went */
function histogram(values,{bins=12,color=C.slate,h=90,fmt=v=>v.toFixed(0)}={}){
  const svg=S("svg",{viewBox:`0 0 ${W} ${h}`,width:"100%",height:h});

  if(vs.length<5)return svg;
  const min=Math.min(...vs),max=Math.max(...vs);
  if(min===max)return svg;
  const counts=new Array(bins).fill(0);
  vs.forEach(v=>{counts[Math.min(bins-1,Math.floor((v-min)/(max-min)*bins))]++;});
  const maxC=Math.max(...counts);
  const PL=8,PT=8,PB=18,IH=h-PT-PB,IW=W-16,bw=IW/bins;
  counts.forEach((c,i)=>{
    const bh=(c/maxC)*IH;
    const r=S("rect",{x:PL+i*bw+1.5,y:PT+IH-bh,width:bw-3,height:Math.max(bh,1),
      fill:color,"fill-opacity":.28+.55*(c/maxC),rx:3});
    bindTip(r,`${fmt(min+(max-min)*(i/bins))}–${fmt(min+(max-min)*((i+1)/bins))}\n${((c/vs.length)*100).toFixed(0)}% of the time`);
    svg.appendChild(r);
  });
  [0,.5,1].forEach(f=>svg.appendChild(txt(S("text",{x:PL+f*IW,y:h-5,
    "text-anchor":f===0?"start":f===1?"end":"middle","font-size":10,fill:C.muted}),fmt(min+(max-min)*f))));
  return svg;
}

      {textContent:(max*f).toFixed(max<10?1:0)}));
  });
  const bw=Math.min(IW/data.length*.62,maxBar);
  data.forEach((d,i)=>{
    const cx=PL+(i+.5)*(IW/data.length);
    if(stacked){
      let acc=0;
      stacked.forEach(k=>{
        const v=d[k]||0; if(v<=0)return;
        const bh=v/max*IH, y=PT+IH-((acc+v)/max*IH);
        const r=svgEl("rect",{x:cx-bw/2,y,width:bw,height:Math.max(bh,1),fill:SPORT_COLOR[k],rx:2});
        r.addEventListener("pointerenter",e=>showTip(e,`${d.label} · ${k}: ${v.toFixed(1)} km`));
        r.addEventListener("pointerleave",hideTip);
        svg.appendChild(r); acc+=v;
      });
    }else{
      const bh=d.v/max*IH, y=PT+IH-bh;
      const r=svgEl("rect",{x:cx-bw/2,y,width:bw,height:Math.max(bh,1),fill:d.color||color,rx:3});
      r.addEventListener("pointerenter",e=>showTip(e,`${d.label} · ${fmt(d.v)}`));
      r.addEventListener("pointerleave",hideTip);
      svg.appendChild(r);
    }
    if(data.length<=14||i%Math.ceil(data.length/8)===0)
      svg.appendChild(Object.assign(svgEl("text",{x:cx,y:h-6,"text-anchor":"middle","font-size":10,fill:C.muted}),{textContent:d.label}));
  });
  return svg;
}

function lineChart(data,{h=150,color=C.slate,fill=null,fmt=v=>v.toFixed(1),yFmt=null,invert=false,dots=true}={}){
  const W=520,PL=38,PR=8,PT=8,PB=20,IH=h-PT-PB,IW=W-PL-PR;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${h}`,width:"100%",height:h});
  if(data.length<2)return svg;
  const vs=data.map(d=>d.v);
  let min=Math.min(...vs),max=Math.max(...vs);
  if(min===max){min-=1;max+=1;}
  const pad=(max-min)*.12; min-=pad; max+=pad;
  const yOf=v=>PT+IH-((v-min)/(max-min))*IH;
  const xOf=i=>PL+(data.length===1?IW/2:i*(IW/(data.length-1)));
  [0,.5,1].forEach(f=>{
    const val=min+(max-min)*f, y=yOf(val);
    svg.appendChild(svgEl("line",{x1:PL,y1:y,x2:W-PR,y2:y,stroke:C.border,"stroke-width":1}));
    svg.appendChild(Object.assign(svgEl("text",{x:PL-6,y:y+3,"text-anchor":"end","font-size":10,fill:C.muted}),
      {textContent:(yFmt||fmt)(val)}));
  });
  const dAttr=data.map((d,i)=>`${i?"L":"M"}${xOf(i).toFixed(1)},${yOf(d.v).toFixed(1)}`).join(" ");
  if(fill){
    svg.appendChild(svgEl("path",{d:`${dAttr} L${xOf(data.length-1)},${PT+IH} L${xOf(0)},${PT+IH} Z`,fill:fill,stroke:"none"}));
  }
  svg.appendChild(svgEl("path",{d:dAttr,fill:"none",stroke:color,"stroke-width":2,"stroke-linecap":"round","stroke-linejoin":"round"}));
  if(dots&&data.length<=60) data.forEach((d,i)=>{
    const c=svgEl("circle",{cx:xOf(i),cy:yOf(d.v),r:3,fill:color});
    c.addEventListener("pointerenter",e=>showTip(e,`${d.label} · ${fmt(d.v)}`));
    c.addEventListener("pointerleave",hideTip);
    svg.appendChild(c);
  });
  const step=Math.max(1,Math.ceil(data.length/6));
  data.forEach((d,i)=>{ if(i%step===0)
    svg.appendChild(Object.assign(svgEl("text",{x:xOf(i),y:h-6,"text-anchor":"middle","font-size":10,fill:C.muted}),{textContent:d.label}));
  });
  return svg;
}

function projectRoute(points,W,H,pad){
  const pts=points.filter(p=>p.la!=null&&p.lo!=null&&!isNaN(p.la)&&!isNaN(p.lo));
  if(pts.length<2)return null;
  const las=pts.map(p=>p.la),los=pts.map(p=>p.lo);
  const minLa=Math.min(...las),maxLa=Math.max(...las),minLo=Math.min(...los),maxLo=Math.max(...los);
  const laR=Math.max(maxLa-minLa,1e-4);
  const lonScale=Math.max(Math.cos(((minLa+maxLa)/2)*Math.PI/180),.15);
  const loR=Math.max((maxLo-minLo)*lonScale,1e-4);
  const sc=Math.min((W-2*pad)/loR,(H-2*pad)/laR);
  const w=loR*sc,hh=laR*sc,ox=(W-w)/2,oy=(H-hh)/2;
  return pts.map(p=>({x:ox+(p.lo-minLo)*lonScale*sc,y:oy+(maxLa-p.la)*sc,d:p.d,t:p.t}));
}
function routeThumb(points,color,W=96,H=68){
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  const pr=projectRoute(points||[],W,H,8);
  if(!pr){svg.appendChild(svgEl("circle",{cx:W/2,cy:H/2,r:3,fill:C.border}));return svg;}
  svg.appendChild(svgEl("path",{d:pr.map((p,i)=>`${i?"L":"M"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" "),
    fill:"none",stroke:color,"stroke-width":1.6,"stroke-linecap":"round","stroke-linejoin":"round"}));
  return svg;
}
function routePaced(points,H=200){
  const W=520;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",height:H});
  const pr=projectRoute(downsample(points||[],150),W,H,14);
  if(!pr||pr.length<2){
    svg.appendChild(Object.assign(svgEl("text",{x:W/2,y:H/2,"text-anchor":"middle","font-size":12,fill:C.muted}),
      {textContent:"No GPS track in this activity"}));
    return svg;
  }
  const paces=[];
  for(let i=1;i<pr.length;i++){
    const dd=pr[i].d-pr[i-1].d, dt=pr[i].t-pr[i-1].t;
    paces.push(dd>0&&dt>0?dt/dd:null);
  }
  const ok=paces.filter(p=>p!=null);
  const avg=ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:null;
  pr.slice(1).forEach((p,i)=>{
    const pace=paces[i];
    let col=C.muted;
    if(pace!=null&&avg) col=pace<avg*.93?C.teal:pace>avg*1.07?C.clay:"#B9A88E";
    svg.appendChild(svgEl("line",{x1:pr[i].x,y1:pr[i].y,x2:p.x,y2:p.y,stroke:col,"stroke-width":3,"stroke-linecap":"round"}));
  });
  return svg;
}

/* ---------------- storage (local cache) ---------------- */
function saveLocal(){
  try{
    localStorage.setItem(LS_INDEX,JSON.stringify(state.index));
    localStorage.setItem(LS_BACKUP,JSON.stringify(state.backedUp));
    localStorage.setItem(LS_DEL,JSON.stringify(state.deleted));
    localStorage.setItem(LS_RES,JSON.stringify(state.restored));
  }catch(e){}
}
function savePoints(id,points){
  try{ localStorage.setItem(LS_PTS+id,JSON.stringify(points)); }catch(e){ /* quota — Dropbox still has it */ }
  state.pointsCache[id]=points;
}
function loadPoints(id){
  if(state.pointsCache[id])return state.pointsCache[id];
  try{
    const v=localStorage.getItem(LS_PTS+id);
    if(v){
      const p=normalizeMovingTime(JSON.parse(v));   // repairs pre-v3.3 uploads too
      state.pointsCache[id]=p;return p;
    }
  }catch(e){}
  return null;
}
function loadLocal(){
  try{
    const idx=localStorage.getItem(LS_INDEX);
    if(idx)state.index=JSON.parse(idx);
    const b=localStorage.getItem(LS_BACKUP);
    if(b)state.backedUp=JSON.parse(b);
    const dl=localStorage.getItem(LS_DEL);
    if(dl)state.deleted=JSON.parse(dl)||{};
    const rs=localStorage.getItem(LS_RES);
    if(rs)state.restored=JSON.parse(rs)||{};
    const d=localStorage.getItem(LS_DBX);
    if(d)state.dbx={...state.dbx,...JSON.parse(d)};
  }catch(e){}
}
/* ---- reverse geocoding via OpenStreetMap Nominatim ----
   One lookup per activity ever; the result is stored on the summary and
   synced to Dropbox. Rate-limited to 1/sec per Nominatim's usage policy.
   Fails silently — a missing place name never blocks anything. */
let geoQueue=[],geoRunning=false;
function queueGeocode(){
  const need=state.index.filter(a=>a.startLat!=null&&!a.geoTried);
  if(!need.length)return;
  geoQueue=need.slice();
  if(!geoRunning)runGeoQueue();
}
async function runGeoQueue(){
  geoRunning=true;state.geoBusy=true;render();
  while(geoQueue.length){
    const q=geoQueue.shift();
    const cur=state.index.find(x=>x.id===q.id);
    if(!cur||cur.geoTried)continue;
    try{
      const u="https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=12&lat="+
        cur.startLat+"&lon="+cur.startLon;
      const r=await fetch(u,{headers:{Accept:"application/json"}});
      if(r.ok){
        const j=await r.json(),ad=j.address||{};
        cur.place=ad.city||ad.town||ad.village||ad.municipality||ad.suburb||ad.county||j.name||null;
        cur.country=ad.country||null;
        cur.countryCode=(ad.country_code||"").toUpperCase()||null;
      }
    }catch(e){ /* offline or blocked — retried next session */ }
    cur.geoTried=true;saveLocal();render();
    await new Promise(r=>setTimeout(r,1100));
  }
  geoRunning=false;state.geoBusy=false;render();
  if(state.dbx.refresh)syncNow();
}
function saveDbx(){ try{localStorage.setItem(LS_DBX,JSON.stringify(state.dbx));}catch(e){} }

/* ---------------- Dropbox: OAuth2 PKCE ---------------- */
function b64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function sha256(str){
  return await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
}
function randomVerifier(){
  const a=new Uint8Array(48); crypto.getRandomValues(a);
  return b64url(a.buffer);
}
function redirectUri(){
  // Must match EXACTLY what is registered in the Dropbox App Console.
  return window.location.origin+window.location.pathname;
}
async function dbxStartAuth(appKey){
  const verifier=randomVerifier();
  const challenge=b64url(await sha256(verifier));
  sessionStorage.setItem("rw:verifier",verifier);
  localStorage.setItem("rw:pendingKey",appKey);
  const u=new URL("https://www.dropbox.com/oauth2/authorize");
  u.searchParams.set("client_id",appKey);
  u.searchParams.set("response_type","code");
  u.searchParams.set("code_challenge",challenge);
  u.searchParams.set("code_challenge_method","S256");
  u.searchParams.set("token_access_type","offline");
  u.searchParams.set("redirect_uri",redirectUri());
  window.location.href=u.toString();
}
async function dbxExchangeCode(code){
  const verifier=sessionStorage.getItem("rw:verifier");
  const appKey=localStorage.getItem("rw:pendingKey")||state.dbx.appKey;
  if(!verifier||!appKey) throw new Error("Missing PKCE verifier — start the connect flow again.");
  const body=new URLSearchParams({
    code, grant_type:"authorization_code", client_id:appKey,
    code_verifier:verifier, redirect_uri:redirectUri(),
  });
  const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",body});
  if(!r.ok) throw new Error("Token exchange failed ("+r.status+"): "+(await r.text()).slice(0,160));
  const j=await r.json();
  state.dbx.appKey=appKey;
  state.dbx.refresh=j.refresh_token||null;
  state.dbx.access=j.access_token;
  state.dbx.expires=Date.now()+((j.expires_in||14400)*1000)-60000;
  saveDbx();
  sessionStorage.removeItem("rw:verifier");
  localStorage.removeItem("rw:pendingKey");
}
async function dbxAccessToken(){
  if(state.dbx.access&&state.dbx.expires&&Date.now()<state.dbx.expires) return state.dbx.access;
  if(!state.dbx.refresh) throw new Error("Not connected to Dropbox.");
  const body=new URLSearchParams({
    grant_type:"refresh_token", refresh_token:state.dbx.refresh, client_id:state.dbx.appKey,
  });
  const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",body});
  if(!r.ok) throw new Error("Could not refresh Dropbox access ("+r.status+")");
  const j=await r.json();
  state.dbx.access=j.access_token;
  state.dbx.expires=Date.now()+((j.expires_in||14400)*1000)-60000;
  saveDbx();
  return state.dbx.access;
}
async function dbxDownload(){
  const tok=await dbxAccessToken();
  const r=await fetch("https://content.dropboxapi.com/2/files/download",{
    method:"POST",
    headers:{Authorization:"Bearer "+tok,"Dropbox-API-Arg":JSON.stringify({path:DBX_FILE})},
  });
  if(r.status===409) return null; // not found yet — first run
  if(!r.ok) throw new Error("Dropbox download failed ("+r.status+")");
  return JSON.parse(await r.text());
}
async function dbxUpload(payload){
  const tok=await dbxAccessToken();
  const r=await fetch("https://content.dropboxapi.com/2/files/upload",{
    method:"POST",
    headers:{
      Authorization:"Bearer "+tok,
      "Dropbox-API-Arg":JSON.stringify({path:DBX_FILE,mode:"overwrite",autorename:false,mute:true}),
      "Content-Type":"application/octet-stream",
    },
    body:JSON.stringify(payload),
  });
  if(!r.ok) throw new Error("Dropbox upload failed ("+r.status+"): "+(await r.text()).slice(0,160));
  return true;
}
async function dbxAccount(){
  const tok=await dbxAccessToken();
  const r=await fetch("https://api.dropboxapi.com/2/users/get_current_account",{
    method:"POST",headers:{Authorization:"Bearer "+tok},
  });
  if(!r.ok) return null;
  const j=await r.json();
  return j?.name?.display_name||null;
}

function buildPayload(){
  const activities=state.index.map(s=>({summary:s,points:loadPoints(s.id)||[]}));
  return {kind:"garmin-analytics-backup",version:2,exportedAt:new Date().toISOString(),
    activities,deleted:state.deleted,restored:state.restored};
}
/* Merge a remote copy into the local one.
   A plain union resurrects anything deleted locally, because "missing here"
   and "deliberately removed here" look identical to it. Tombstones — an id
   plus when it was deleted — tell those apart, and travel with the payload
   so every device honours the same deletions. */
function mergeActivities(list,remoteDeleted,remoteRestored){
  // Re-importing a file you previously deleted is a deliberate undelete, so a
  // restore that happened AFTER a deletion beats the tombstone. Comparing the
  // two timestamps keeps that decision stable no matter which device syncs first.
  if(remoteRestored&&typeof remoteRestored==="object"){
    Object.keys(remoteRestored).forEach(id=>{
      if(!state.restored[id]||new Date(remoteRestored[id])>new Date(state.restored[id]))
        state.restored[id]=remoteRestored[id];
    });
  }
  if(remoteDeleted&&typeof remoteDeleted==="object"){
    Object.keys(remoteDeleted).forEach(id=>{
      if(!state.deleted[id]||new Date(remoteDeleted[id])>new Date(state.deleted[id]))
        state.deleted[id]=remoteDeleted[id];
    });
  }
  // drop any tombstone that a later restore has overruled
  Object.keys(state.deleted).forEach(id=>{
    if(state.restored[id]&&new Date(state.restored[id])>new Date(state.deleted[id]))
      delete state.deleted[id];
  });
  const map=new Map(state.index.map(a=>[a.id,a]));
  let removedHere=0;
  Object.keys(state.deleted).forEach(id=>{
    if(map.has(id)){
      map.delete(id);removedHere++;
      try{localStorage.removeItem(LS_PTS+id);}catch(e){}
      delete state.pointsCache[id];
    }
  });
  let added=0;
  list.forEach(entry=>{
    const s=entry.summary; if(!s||!s.id)return;
    if(state.deleted[s.id])return;            // deleted on purpose — stays gone
    if(!map.has(s.id)){map.set(s.id,s);added++;}
    else{const cur=map.get(s.id);
      if(!cur.place&&s.place)map.set(s.id,{...cur,place:s.place,country:s.country,
        countryCode:s.countryCode,geoTried:true});}
    if(entry.points&&entry.points.length&&!(loadPoints(s.id)||[]).length) savePoints(s.id,entry.points);
  });
  state.index=Array.from(map.values()).sort((a,b)=>new Date(b.startTime)-new Date(a.startTime));
  return {added,removedHere};
}
async function syncNow({push=true}={}){
  if(!state.dbx.refresh)return;
  state.syncing=true; render();
  try{
    const remote=await dbxDownload();
    let added=0,removedHere=0;
    if(remote&&Array.isArray(remote.activities)){
      const r=mergeActivities(remote.activities,remote.deleted,remote.restored);
      added=r.added; removedHere=r.removedHere;
    }
    if(push) await dbxUpload(buildPayload());
    state.backedUp=state.index.map(a=>a.id);
    saveLocal();
    const bits=[];
    if(added)bits.push(`${added} pulled in`);
    if(removedHere)bits.push(`${removedHere} removed`);
    state.syncMsg={ok:true,text:"Synced with Dropbox"+(bits.length?" · "+bits.join(", "):"")};
  }catch(e){
    state.syncMsg={ok:false,text:e.message||"Sync failed"};
  }finally{
    state.syncing=false; render();
  }
}

/* ---------------- import ---------------- */
async function importEntries(entries){
  const ready=[],pending=[],errors=[],dupes=[],replaced=[];
  for(const {name,text} of entries){
    const trimmed=text.trim();
    if(trimmed.startsWith("{")){
      let b=null; try{b=JSON.parse(trimmed);}catch(e){}
      if(b&&b.kind==="garmin-analytics-backup"&&Array.isArray(b.activities)){
        b.activities.forEach(en=>{
          if(!en.summary||!en.summary.id)return;
          const d=findDuplicate(en.summary);
          if(d&&d.kind==="same"&&d.existing.id!==en.summary.id)return; // already present
          ready.push(en.summary);
          if(en.points&&en.points.length)savePoints(en.summary.id,en.points);
        });
        continue;
      }
    }
    try{
      const isGPX=/\.gpx$/i.test(name)||text.slice(0,300).toLowerCase().includes("<gpx");
      const res=isGPX?parseGPX(text,name):parseTCX(text,name);
      res.forEach(r=>{
        const dup=findDuplicate(r.summary);
        if(dup&&dup.kind==="same"){
          /* Provably the same activity: refresh it under the id it already has
             so nothing duplicates and no stored track data is orphaned. A sport
             label or place you set by hand is preserved. */
          const merged={...r.summary,id:dup.existing.id,
            sport:dup.existing.sportSource==="manual"?dup.existing.sport:r.summary.sport,
            sportSource:dup.existing.sportSource==="manual"?"manual":r.summary.sportSource,
            place:dup.existing.place,country:dup.existing.country,
            countryCode:dup.existing.countryCode,geoTried:dup.existing.geoTried};
          ready.push(merged); savePoints(merged.id,r.points);
          replaced.push({name,why:dup.why});
          return;
        }
        if(dup&&dup.kind==="probable"){
          dupes.push({summary:r.summary,points:r.points,existing:dup.existing,why:dup.why,fileName:name});
          return;
        }
        if(r.summary.sportSource==="unset") pending.push({summary:r.summary,points:r.points,chosen:null});
        else { ready.push(r.summary); savePoints(r.summary.id,r.points); }
      });
    }catch(e){ errors.push(`${name} — ${e.message||"could not be read"}`); }
  }
  if(ready.length){
    const map=new Map(state.index.map(a=>[a.id,a]));
    const nowIso=new Date().toISOString();
    ready.forEach(s=>{
      if(state.deleted[s.id]){delete state.deleted[s.id];state.restored[s.id]=nowIso;}
      map.set(s.id,s);
    });
    state.index=Array.from(map.values()).sort((a,b)=>new Date(b.startTime)-new Date(a.startTime));
    saveLocal();
  }
  if(pending.length) state.pending=state.pending.concat(pending);
  if(dupes.length) state.dupes=state.dupes.concat(dupes);
  state.toast={ok:ready.length,pending:pending.length,errors,dupes:dupes.length,replaced};
  render();
  setTimeout(()=>{state.toast=null;render();},7000);
  queueGeocode();
  if(ready.length&&state.dbx.refresh) syncNow();
}
function readFile(f){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("could not be read"));
    r.readAsText(f);
  });
}
async function handleFiles(list){
  const files=Array.from(list||[]); if(!files.length)return;
  const entries=[];
  for(const f of files){
    try{ entries.push({name:f.name,text:await readFile(f)}); }
    catch(e){ /* surfaced below */ }
  }
  await importEntries(entries);
}

/* ---------------- actions ---------------- */
function cycleSport(id){
  state.index=state.index.map(a=>a.id!==id?a:
    ({...a,sport:SPORT_ORDER[(SPORT_ORDER.indexOf(a.sport)+1)%SPORT_ORDER.length],sportSource:"manual"}));
  saveLocal(); render();
  if(state.dbx.refresh) syncNow();
}
function deleteActivity(id){
  state.deleted[id]=new Date().toISOString();   // tombstone so sync can't resurrect it
  delete state.restored[id];
  state.index=state.index.filter(a=>a.id!==id);
  try{localStorage.removeItem(LS_PTS+id);}catch(e){}
  delete state.pointsCache[id];
  state.confirmDel=null;
  if(state.selectedId===id)state.selectedId=null;
  saveLocal(); render();
  if(state.dbx.refresh) syncNow();
}
/* Local-only wipe. Dropbox keeps everything, so the next sync restores it —
   useful for clearing a borrowed device or forcing a clean re-pull. */
function resetDevice(){
  state.index.forEach(a=>{try{localStorage.removeItem(LS_PTS+a.id);}catch(e){}});
  state.index=[]; state.pointsCache={}; state.backedUp=[]; state.selectedId=null;
  state.showClear=false; saveLocal(); render();
  if(state.dbx.refresh) syncNow();
}
/* Real delete everywhere: tombstones every activity so the removal
   propagates to Dropbox and every other device. */
function deleteEverything(){
  const now=new Date().toISOString();
  state.index.forEach(a=>{state.deleted[a.id]=now;delete state.restored[a.id];
    try{localStorage.removeItem(LS_PTS+a.id);}catch(e){}});
  state.index=[]; state.pointsCache={}; state.backedUp=[]; state.selectedId=null;
  state.showClear=false; saveLocal(); render();
  if(state.dbx.refresh) syncNow();
}
function resolveDupe(entry,choice){
  state.dupes=state.dupes.filter(x=>x!==entry);
  if(choice==="discard"){render();return;}
  const map=new Map(state.index.map(a=>[a.id,a]));
  if(choice==="replace"){
    map.delete(entry.existing.id);
    try{localStorage.removeItem(LS_PTS+entry.existing.id);}catch(e){}
    delete state.pointsCache[entry.existing.id];
    state.deleted[entry.existing.id]=new Date().toISOString();
    delete state.restored[entry.existing.id];
  }else if(choice==="both"){
    let id=entry.summary.id,n=2;
    while(map.has(id))id=entry.summary.id+"-"+(n++);
    entry.summary={...entry.summary,id};
  }
  delete state.deleted[entry.summary.id];
  savePoints(entry.summary.id,entry.points);
  map.set(entry.summary.id,entry.summary);
  state.index=Array.from(map.values()).sort((a,b)=>new Date(b.startTime)-new Date(a.startTime));
  saveLocal();render();queueGeocode();
  if(state.dbx.refresh)syncNow();
}
function renderDupes(){
  const host=$("dupes");if(!host)return;
  host.innerHTML="";
  state.dupes.forEach(dp=>{
    const card=el("div",{class:"panel alert"});
    card.appendChild(el("div",{style:{fontSize:"13px",fontWeight:"700"}},"Possible duplicate"));
    card.appendChild(el("p",{class:"sub",style:{marginTop:"4px"}},
      `${dp.fileName} looks like something already in your log — ${dp.why}. Nothing definitive matched, so it's your call.`));
    const cmp=el("div",{class:"metgrid",style:{marginTop:"10px"}});
    cmp.appendChild(metric("Already in your log",fmtKm(dp.existing.distanceKm,2),
      `${fmtDateLong(dp.existing.startTime)} · ${fmtDur(dp.existing.durationSec)}`));
    cmp.appendChild(metric("Just uploaded",fmtKm(dp.summary.distanceKm,2),
      `${fmtDateLong(dp.summary.startTime)} · ${fmtDur(dp.summary.durationSec)}`));
    card.appendChild(cmp);
    card.appendChild(el("div",{class:"row-actions",style:{flexDirection:"column",alignItems:"stretch"}},
      el("button",{class:"btn",onclick:()=>resolveDupe(dp,"discard")},"Discard the upload"),
      el("button",{class:"btn",onclick:()=>resolveDupe(dp,"replace")},"Replace the existing one"),
      el("button",{class:"btn btn-primary",onclick:()=>resolveDupe(dp,"both")},"Keep both — different runs")));
    host.appendChild(card);
  });
}
function confirmPending(id){
  const it=state.pending.find(p=>p.summary.id===id);
  if(!it||!it.chosen)return;
  const s={...it.summary,sport:it.chosen,sportSource:"manual"};
  savePoints(id,it.points);
  const map=new Map(state.index.map(a=>[a.id,a]));
  map.set(id,s);
  state.index=Array.from(map.values()).sort((a,b)=>new Date(b.startTime)-new Date(a.startTime));
  state.pending=state.pending.filter(p=>p.summary.id!==id);
  saveLocal(); render(); queueGeocode();
  if(state.dbx.refresh) syncNow();
}
async function exportBackup(){
  const json=JSON.stringify(buildPayload());
  const filename=`runs-and-walks-${new Date().toISOString().slice(0,10)}.json`;
  let shared=false;
  try{
    if(navigator.canShare){
      const f=new File([json],filename,{type:"application/json"});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:filename}); shared=true; }
    }
  }catch(e){}
  if(!shared){
    try{
      const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));
      const a=document.createElement("a"); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),2000);
    }catch(e){ state.exportText=json; render(); return; }
  }
  state.backedUp=state.index.map(a=>a.id); saveLocal(); render();
}

function actTip(a){

const TREND_METRICS=[
  {k:"pace",label:"Pace",key:"avgPaceSecPerKm",fmt:v=>fmtPaceShort(v)+"/km",invert:true,color:C.clay,
   note:"Rolling 5-activity average. Lower is faster."},
  {k:"hr",label:"Heart rate",key:"avgHR",fmt:v=>Math.round(v)+" bpm",color:C.plum,
   note:"Average heart rate, smoothed over 5 activities."},
  {k:"cadence",label:"Cadence",key:"avgCadence",fmt:v=>Math.round(v)+" spm",color:C.teal,
   note:"Steps per minute while moving. Most runners are efficient around 170–180."},
  {k:"power",label:"Power",key:"avgPower",fmt:v=>Math.round(v)+" W",color:C.amber,
   note:"Running power from your watch — effort independent of hills and wind."},
  {k:"ef",label:"Efficiency",key:"efficiencyIndex",fmt:v=>v.toFixed(2),color:C.slate,
   note:"Metres per heartbeat. Rising over time means aerobic fitness improving."},
  {k:"step",label:"Step length",key:"avgStepLen",fmt:v=>v.toFixed(2)+" m",color:C.charcoal,
   note:"Distance per step, derived from speed and cadence."},
];
function viewTrends(){
  const v=el("div",{class:"view"});
  const list=filtered();
  if(list.length<2){
    v.appendChild(el("div",{class:"card muted-note"},"Upload a few more activities to see trends build up."));
    return v;
  }
  const avail=TREND_METRICS.filter(m=>list.filter(a=>a[m.key]!=null).length>=2);
  if(avail.length){
    const row=el("div",{class:"chip-row",style:{padding:"0 0 2px"}});
    avail.forEach(m=>row.appendChild(el("button",{class:"chip"+(state.trendMetric===m.k?" active":""),
      onclick:()=>{state.trendMetric=m.k;render();}},m.label)));
    v.appendChild(row);
    const m=avail.find(x=>x.k===state.trendMetric)||avail[0];
    const data=rolling(list,m.key,5);
    if(data.length>1){
      const delta=data[data.length-1].v-data[0].v;
      const better=m.invert?delta<0:delta>0;
      const arrow=Math.abs(delta)<1e-9?"→":(delta>0?"↑":"↓");
      v.appendChild(cardWith(`${m.label} trend`,`${arrow} ${m.fmt(Math.abs(delta))}`,
        lineChart(data,{color:m.color,fmt:m.fmt,h:170}),
        el("p",{class:"cap"},m.note+(data.length>4?(better?" Moving the right way across this window.":" Drifting the other way across this window."):""))));
    }
  }

  const agg=el("div",{class:"metgrid"});
  const add=(l,val,hint)=>{if(val!=null)agg.appendChild(metric(l,val,hint));};
  const paces=list.map(a=>a.avgPaceSecPerKm).filter(x=>x!=null);
  if(paces.length)add("Average pace",fmtPace(mean(paces)),`across ${paces.length} activities`);
  const hrs=list.map(a=>a.avgHR).filter(x=>x!=null);
  if(hrs.length)add("Average HR",Math.round(mean(hrs))+" bpm",`peak ${Math.max(...list.map(a=>a.maxHR||0))} bpm`);
  const cads=list.map(a=>a.avgCadence).filter(x=>x!=null);
  if(cads.length)add("Average cadence",Math.round(mean(cads))+" spm","steps per minute");
  const pws=list.map(a=>a.avgPower).filter(x=>x!=null);
  if(pws.length)add("Average power",Math.round(mean(pws))+" W","running power");
  const efs=list.map(a=>a.efficiencyIndex).filter(x=>x!=null);
  if(efs.length)add("Efficiency index",mean(efs).toFixed(2),"metres per heartbeat");
  const sls=list.map(a=>a.avgStepLen).filter(x=>x!=null);
  if(sls.length)add("Step length",mean(sls).toFixed(2)+" m","per step");
  if(agg.children.length)v.appendChild(cardWith("Averages across everything",null,agg));

  const both=list.filter(a=>a.avgPaceSecPerKm&&a.avgHR);
  if(both.length>2){
    v.appendChild(cardWith("Pace against heart rate","size = distance",
      bubbleScatter(both,{xOf:a=>a.avgHR,yOf:a=>a.avgPaceSecPerKm,rOf:a=>a.distanceKm,
        xFmt:v=>Math.round(v)+"",yFmt:v=>fmtPaceShort(v),xLabel:"average heart rate (bpm)",
        yLabel:"pace",invertY:true,tip:actTip}),
      el("p",{class:"cap"},"Top-left is the sweet spot — faster pace at a lower heart rate. Bubbles migrating that way over time is fitness improving.")));
  }

  const wk=weeklyOf(list);
  if(wk.length>1){
    const shown=wk.slice(-16),maxKm=Math.max(...shown.map(w=>w.km));
    const svg=S("svg",{viewBox:`0 0 ${W} 120`,width:"100%",height:120});
    const PL=16,IW=W-32,cy=54;
    shown.forEach((w,i)=>{
      const cx=PL+(i+.5)*(IW/shown.length);
      const r=4+Math.sqrt(w.km/maxKm)*20;
      const c=S("circle",{cx,cy,r,fill:C.clay,"fill-opacity":.38,stroke:C.clay,"stroke-width":1.6});
      bindTip(c,`Week of ${w.label}\n${fmtKm(w.km,1)} · ${w.n} activit${w.n===1?"y":"ies"}\n${fmtDur(w.sec)}`);
      svg.appendChild(c);
      if(i%Math.max(1,Math.ceil(shown.length/6))===0)
        svg.appendChild(txt(S("text",{x:cx,y:108,"text-anchor":"middle","font-size":10,fill:C.muted}),w.label));
    });
    v.appendChild(cardWith("Weekly volume","size = distance",svg,
      el("p",{class:"cap"},"Consistency looks like evenly sized bubbles; gaps and spikes jump out.")));
  }

  const nDel=Object.keys(state.deleted).length;
  if(nDel)v.appendChild(el("div",{class:"card",style:{padding:"10px 14px",fontSize:"12px",color:C.muted,
    display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px"}},
    el("span",null,`${nDel} deleted activit${nDel===1?"y":"ies"} kept out of sync`),
    el("button",{class:"link-btn",onclick:()=>{
      state.deleted={};state.restored={};saveLocal();render();
      if(state.dbx.refresh)syncNow();}},"Forget")));
  const rows=el("div");
  [...list].sort((a,b)=>new Date(b.startTime)-new Date(a.startTime)).forEach(a=>{
    const r=el("div",{class:"arow"});
    r.appendChild(el("div",{class:"main"},
      el("div",{class:"date"},fmtDateShort(a.startTime)),
      a.place?el("div",{class:"place"},a.place):null,
      el("button",{class:"pill",style:{color:SPORT_COLOR[a.sport],borderColor:SPORT_COLOR[a.sport]},
        onclick:()=>cycleSport(a.id)},a.sport)));
    r.appendChild(el("div",{class:"stats"},
      el("span",null,fmtKm(a.distanceKm)),el("span",null,fmtDur(a.durationSec)),
      el("span",null,fmtPace(a.avgPaceSecPerKm)),
      a.avgCadence?el("span",{style:{color:C.muted}},a.avgCadence+" spm"):null,
      a.avgPower?el("span",{style:{color:C.muted}},a.avgPower+" W"):null));
    r.appendChild(el("button",{class:"del"+(state.confirmDel===a.id?" confirm":""),
      onclick:()=>{if(state.confirmDel===a.id)deleteActivity(a.id);else{state.confirmDel=a.id;render();}},
      onblur:()=>{if(state.confirmDel===a.id){state.confirmDel=null;render();}}},
      state.confirmDel===a.id?"Confirm?":"✕"));
    rows.appendChild(r);
  });
  v.appendChild(cardWith("All activities",String(list.length),rows));
  return v;
}

function viewDetail(){

  if(a.efficiencyIndex)mg.appendChild(metric("Efficiency index",a.efficiencyIndex,"metres per heartbeat"));
  if(a.decouplingPct!=null)mg.appendChild(metric("Aerobic decoupling",a.decouplingPct+"%",

  if(a.negSplitSec!=null)mg.appendChild(metric("Second half",
    (a.negSplitSec>0?"−":"+")+fmtPaceShort(Math.abs(a.negSplitSec)),
    a.negSplitSec>0?"negative split — finished faster":"positive split — slowed down"));
  if(a.elevGainM!=null)mg.appendChild(metric("Elevation gain",Math.round(a.elevGainM)+" m",
    a.distanceKm?`${(a.elevGainM/a.distanceKm).toFixed(1)} m per km`:null));
  if(a.calories!=null)mg.appendChild(metric("Energy",a.calories+" kcal",null));
  if(a.stoppedSec)mg.appendChild(metric("Stopped",fmtDur(a.stoppedSec),
    `moving time ${fmtDur(a.durationSec)} — pace excludes this`));
  if(mg.children.length)v.appendChild(cardWith("Running dynamics",null,mg,
    el("p",{class:"cap"},"Vertical oscillation, vertical ratio and ground contact time aren't here — Garmin writes those only to FIT files, not TCX.")));

  if(!pts.length){
    v.appendChild(el("div",{class:"card muted-note"},
      "Detailed track data isn't stored for this one — re-upload its file to see the streams."));
    return v;
  }
  const ds2=downsample(pts,200);
  const ele=ds2.filter(p=>p.a!=null&&p.d!=null);
  if(ele.length>1)v.appendChild(cardWith("Elevation",`${a.elevGainM||0} m gain`,

  const hr=ds2.filter(p=>p.h!=null&&p.d!=null);
  if(hr.length>1)v.appendChild(cardWith("Heart rate",`avg ${a.avgHR} bpm`,
    lineChart(hr.map(p=>({label:p.d.toFixed(1),v:p.h})),
      {color:C.plum,h:120,dots:false,fmt:v=>Math.round(v)+" bpm"}),
    histogram(pts.map(p=>p.h),{color:C.plum,h:80,fmt:v=>Math.round(v)+""}),
    el("p",{class:"cap"},"The strip below shows how much of the run sat at each heart rate.")));
  const cad=ds2.filter(p=>p.c!=null&&p.c>0&&p.d!=null);
  if(cad.length>1)v.appendChild(cardWith("Cadence",`avg ${a.avgCadence} spm`,
    lineChart(cad.map(p=>({label:p.d.toFixed(1),v:p.c})),
      {color:C.teal,h:120,dots:false,fmt:v=>Math.round(v)+" spm",band:[170,180]}),
    el("p",{class:"cap"},"Shaded band is the 170–180 spm range most runners are efficient in.")));
  const pw=ds2.filter(p=>p.w!=null&&p.w>0&&p.d!=null);
  if(pw.length>1)v.appendChild(cardWith("Power",`avg ${a.avgPower} W`,
    lineChart(pw.map(p=>({label:p.d.toFixed(1),v:p.w})),
      {color:C.amber,h:120,dots:false,fmt:v=>Math.round(v)+" W"}),
    histogram(pts.map(p=>p.w).filter(x=>x!=null&&x>0),{color:C.amber,h:80,fmt:v=>Math.round(v)+""}),
    el("p",{class:"cap"},"Power tracks effort directly, where pace gets distorted by hills and wind.")));

  const sp=splitsOf(pts);
  if(sp.length){
    const full=sp.filter(x=>!x.partial);
    const avg=full.length?mean(full.map(x=>x.sec)):0;
    v.appendChild(cardWith("Kilometre splits",`avg ${fmtPaceShort(avg)}/km`,
      lollipop(sp.map(x=>({label:x.label,v:x.sec,

             x.hr?`${Math.round(x.hr)} bpm`:null,
             x.cad?`${Math.round(x.cad)} spm`:null,
