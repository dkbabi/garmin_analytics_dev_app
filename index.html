  const all=filtered();
  let sel=all;
  if(state.range!=="all"){
    const cut=new Date();cut.setDate(cut.getDate()-parseInt(state.range,10));
    sel=all.filter(a=>new Date(a.startTime)>=cut);
  }
  const chips=el("div",{class:"chip-row",style:{padding:"0 0 4px"}});
  [["30","30d"],["90","90d"],["365","1y"],["all","All"]].forEach(([k,l])=>
    chips.appendChild(el("button",{class:"chip"+(state.range===k?" active":""),
      onclick:()=>{state.range=k;render();}},l)));
  v.appendChild(chips);

  const km=sel.reduce((s,a)=>s+a.distanceKm,0);
  const dur=sel.reduce((s,a)=>s+a.durationSec,0);
  const elev=sel.reduce((s,a)=>s+(a.elevGainM||0),0);
  const g=el("div",{class:"grid2"});
  g.appendChild(statCard("Distance",fmtKm(km,1),C.clay));
  g.appendChild(statCard("Time moving",fmtDur(dur),C.slate));
  g.appendChild(statCard("Avg pace",fmtPace(km>0?dur/km:null),C.teal));
  g.appendChild(statCard("Activities",String(sel.length),C.charcoal));
  v.appendChild(g);
  if(elev)v.appendChild(el("div",{class:"card",style:{padding:"10px 14px",fontSize:"12px",color:C.muted}},
    `${Math.round(elev)} m climbed across this window`));

  const groups=placesOf(sel);
  if(groups.length){
    const tot=groups.reduce((s,c)=>s+c.places.length,0);
    v.appendChild(cardWith("Places you've run",
      `${tot} place${tot===1?"":"s"} · ${groups.length} countr${groups.length===1?"y":"ies"}`,
      placesBlock(groups)));
  }else if(state.geoBusy){
    v.appendChild(cardWith("Places you've run",null,el("div",{class:"muted-note"},"Looking up locations…")));
  }else if(sel.some(a=>a.startLat!=null)){
    v.appendChild(cardWith("Places you've run",null,
      el("div",{class:"muted-note"},"Location lookup hasn't returned yet — it retries when you reopen the app.")));
  }

  if(sel.length>1){
    v.appendChild(cardWith("Every activity","size = distance",
      bubbleTimeline([...sel].sort((a,b)=>new Date(a.startTime)-new Date(b.startTime)),{
        yOf:a=>a.avgPaceSecPerKm,yFmt:v=>fmtPaceShort(v),yLabel:"pace",invert:true,
        rOf:a=>a.distanceKm,tip:actTip}),
      el("p",{class:"cap"},"Higher bubbles are faster, bigger bubbles are longer, colour is the activity type. Tap any bubble for detail.")));
  }

  const recent=[...sel].sort((a,b)=>new Date(b.startTime)-new Date(a.startTime)).slice(0,6);
  if(recent.length){
    const gal=el("div",{style:{display:"flex",gap:"10px",overflowX:"auto"}});
    recent.forEach(a=>{
      const box=el("div",{style:{flex:"0 0 auto",textAlign:"center"}});
      box.appendChild(routeThumb(loadPoints(a.id),SPORT_COLOR[a.sport]));
      box.appendChild(el("div",{style:{fontSize:"10px",color:C.muted,marginTop:"4px"}},
        `${fmtDateShort(a.startTime)} · ${fmtKm(a.distanceKm,1)}`));
      if(a.place)box.appendChild(el("div",{style:{fontSize:"9.5px",color:C.muted}},a.place));
      gal.appendChild(box);
    });
    v.appendChild(cardWith("Recent routes",null,gal));
  }
  if(!sel.length)v.appendChild(el("div",{class:"card muted-note"},"Nothing in this window — try a wider range."));
  return v;
}

const TREND_METRICS=[
  {k:"pace",label:"Pace",key:"avgPaceSecPerKm",fmt:v=>fmtPaceShort(v)+"/km",invert:true,color:C.clay,
   note:"Rolling 5-activity average. Lower is faster."},
  {k:"hr",label:"Heart rate",key:"avgHR",fmt:v=>Math.round(v)+" bpm",color:C.plum,
   note:"Average heart rate, smoothed over 5 activities."},
  {k:"cadence",label:"Cadence",key:"avgCadence",fmt:v=>Math.round(v)+" spm",color:C.teal,
   note:"Steps per minute while moving. Most runners are efficient around 170–180."},
  {k:"power",label:"Power",key:"avgPower",fmt:v=>Math.round(v)+" W",color:C.amber,
   note:"Running power from your watch — effort independent of hills and wind."},
  {k:"ef",label:"Efficiency",key:"efficiencyIndex",fmt:v=>v.toFixed(2),color:C.slate,
   note:"Metres per heartbeat. Rising over time means aerobic fitness improving."},
  {k:"step",label:"Step length",key:"avgStepLen",fmt:v=>v.toFixed(2)+" m",color:C.charcoal,
   note:"Distance per step, derived from speed and cadence."},
];
function viewTrends(){
  const v=el("div",{class:"view"});
  const list=filtered();
  if(list.length<2){
    v.appendChild(el("div",{class:"card muted-note"},"Upload a few more activities to see trends build up."));
    return v;
  }
  const avail=TREND_METRICS.filter(m=>list.filter(a=>a[m.key]!=null).length>=2);
  if(avail.length){
    const row=el("div",{class:"chip-row",style:{padding:"0 0 2px"}});
    avail.forEach(m=>row.appendChild(el("button",{class:"chip"+(state.trendMetric===m.k?" active":""),
      onclick:()=>{state.trendMetric=m.k;render();}},m.label)));
    v.appendChild(row);
    const m=avail.find(x=>x.k===state.trendMetric)||avail[0];
    const data=rolling(list,m.key,5);
    if(data.length>1){
      const delta=data[data.length-1].v-data[0].v;
      const better=m.invert?delta<0:delta>0;
      const arrow=Math.abs(delta)<1e-9?"→":(delta>0?"↑":"↓");
      v.appendChild(cardWith(`${m.label} trend`,`${arrow} ${m.fmt(Math.abs(delta))}`,
        lineChart(data,{color:m.color,fmt:m.fmt,h:170}),
        el("p",{class:"cap"},m.note+(data.length>4?(better?" Moving the right way across this window.":" Drifting the other way across this window."):""))));
    }
  }

  const agg=el("div",{class:"metgrid"});
  const add=(l,val,hint)=>{if(val!=null)agg.appendChild(metric(l,val,hint));};
  const paces=list.map(a=>a.avgPaceSecPerKm).filter(x=>x!=null);
  if(paces.length)add("Average pace",fmtPace(mean(paces)),`across ${paces.length} activities`);
  const hrs=list.map(a=>a.avgHR).filter(x=>x!=null);
  if(hrs.length)add("Average HR",Math.round(mean(hrs))+" bpm",`peak ${Math.max(...list.map(a=>a.maxHR||0))} bpm`);
  const cads=list.map(a=>a.avgCadence).filter(x=>x!=null);
  if(cads.length)add("Average cadence",Math.round(mean(cads))+" spm","steps per minute");
  const pws=list.map(a=>a.avgPower).filter(x=>x!=null);
  if(pws.length)add("Average power",Math.round(mean(pws))+" W","running power");
  const efs=list.map(a=>a.efficiencyIndex).filter(x=>x!=null);
  if(efs.length)add("Efficiency index",mean(efs).toFixed(2),"metres per heartbeat");
  const sls=list.map(a=>a.avgStepLen).filter(x=>x!=null);
  if(sls.length)add("Step length",mean(sls).toFixed(2)+" m","per step");
  if(agg.children.length)v.appendChild(cardWith("Averages across everything",null,agg));

  const both=list.filter(a=>a.avgPaceSecPerKm&&a.avgHR);
  if(both.length>2){
    v.appendChild(cardWith("Pace against heart rate","size = distance",
      bubbleScatter(both,{xOf:a=>a.avgHR,yOf:a=>a.avgPaceSecPerKm,rOf:a=>a.distanceKm,
        xFmt:v=>Math.round(v)+"",yFmt:v=>fmtPaceShort(v),xLabel:"average heart rate (bpm)",
        yLabel:"pace",invertY:true,tip:actTip}),
      el("p",{class:"cap"},"Top-left is the sweet spot — faster pace at a lower heart rate. Bubbles migrating that way over time is fitness improving.")));
  }

  const wk=weeklyOf(list);
  if(wk.length>1){
    const shown=wk.slice(-16),maxKm=Math.max(...shown.map(w=>w.km));
    const svg=S("svg",{viewBox:`0 0 ${W} 120`,width:"100%",height:120});
    const PL=16,IW=W-32,cy=54;
    shown.forEach((w,i)=>{
      const cx=PL+(i+.5)*(IW/shown.length);
      const r=4+Math.sqrt(w.km/maxKm)*20;
      const c=S("circle",{cx,cy,r,fill:C.clay,"fill-opacity":.38,stroke:C.clay,"stroke-width":1.6});
      bindTip(c,`Week of ${w.label}\n${fmtKm(w.km,1)} · ${w.n} activit${w.n===1?"y":"ies"}\n${fmtDur(w.sec)}`);
      svg.appendChild(c);
      if(i%Math.max(1,Math.ceil(shown.length/6))===0)
        svg.appendChild(txt(S("text",{x:cx,y:108,"text-anchor":"middle","font-size":10,fill:C.muted}),w.label));
    });
    v.appendChild(cardWith("Weekly volume","size = distance",svg,
      el("p",{class:"cap"},"Consistency looks like evenly sized bubbles; gaps and spikes jump out.")));
  }

  const nDel=Object.keys(state.deleted).length;
  if(nDel)v.appendChild(el("div",{class:"card",style:{padding:"10px 14px",fontSize:"12px",color:C.muted,
    display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px"}},
    el("span",null,`${nDel} deleted activit${nDel===1?"y":"ies"} kept out of sync`),
    el("button",{class:"link-btn",onclick:()=>{
      state.deleted={};state.restored={};saveLocal();render();
      if(state.dbx.refresh)syncNow();}},"Forget")));
  const rows=el("div");
  [...list].sort((a,b)=>new Date(b.startTime)-new Date(a.startTime)).forEach(a=>{
    const r=el("div",{class:"arow"});
    r.appendChild(el("div",{class:"main"},
      el("div",{class:"date"},fmtDateShort(a.startTime)),
      a.place?el("div",{class:"place"},a.place):null,
      el("button",{class:"pill",style:{color:SPORT_COLOR[a.sport],borderColor:SPORT_COLOR[a.sport]},
        onclick:()=>cycleSport(a.id)},a.sport)));
    r.appendChild(el("div",{class:"stats"},
      el("span",null,fmtKm(a.distanceKm)),el("span",null,fmtDur(a.durationSec)),
      el("span",null,fmtPace(a.avgPaceSecPerKm)),
      a.avgCadence?el("span",{style:{color:C.muted}},a.avgCadence+" spm"):null,
      a.avgPower?el("span",{style:{color:C.muted}},a.avgPower+" W"):null));
    r.appendChild(el("button",{class:"del"+(state.confirmDel===a.id?" confirm":""),
      onclick:()=>{if(state.confirmDel===a.id)deleteActivity(a.id);else{state.confirmDel=a.id;render();}},
      onblur:()=>{if(state.confirmDel===a.id){state.confirmDel=null;render();}}},
      state.confirmDel===a.id?"Confirm?":"✕"));
    rows.appendChild(r);
  });
  v.appendChild(cardWith("All activities",String(list.length),rows));
  return v;
}

function viewDetail(){
  const v=el("div",{class:"view"});
  const list=[...filtered()].sort((a,b)=>new Date(b.startTime)-new Date(a.startTime));
  if(!list.length){v.appendChild(el("div",{class:"card muted-note"},"No activities yet."));return v;}
  if(!state.selectedId||!list.some(a=>a.id===state.selectedId))state.selectedId=list[0].id;
  const a=list.find(x=>x.id===state.selectedId);

  const wrap=el("div",{class:"sel-wrap"});
  const sel=el("select",{class:"sel",onchange:e=>{state.selectedId=e.target.value;render();}});
  list.forEach(x=>{
    const o=el("option",{value:x.id},
      `${fmtDateLong(x.startTime)} · ${x.sport} · ${fmtKm(x.distanceKm,1)}${x.place?" · "+x.place:""}`);
    if(x.id===a.id)o.selected=true;sel.appendChild(o);
  });
  wrap.appendChild(sel);v.appendChild(wrap);

  const pts=loadPoints(a.id)||[];
  const card=el("div",{class:"card"});
  if(a.place||a.country)card.appendChild(el("div",{style:{fontSize:"12px",color:C.muted,marginBottom:"8px"}},
    `${countryFlag(a.countryCode)} ${a.place||""}${a.place&&a.country?", ":""}${a.country||""}`));
  const hasGPS=pts.length&&pts.some(p=>p.la!=null);
  if(hasGPS){
    const toggle=el("div",{class:"map-toggle"});
    [["map","Map"],["plain","Route only"]].forEach(([mode,lbl])=>{
      toggle.appendChild(el("button",{class:"chip"+(state.mapMode===mode?" active":""),
        onclick:()=>{state.mapMode=mode;
          try{localStorage.setItem("rw:mapmode",mode);}catch(e){}
          render();}},lbl));
    });
    card.appendChild(toggle);
  }
  const mapWrap=el("div");
  if(hasGPS&&state.mapMode==="map"){
    renderMap(mapWrap,pts);
    mapWrap.appendChild(el("p",{class:"map-note"},
      "Teal where you ran faster than this activity's average, clay where slower. Pinch to zoom."));
  }else{
    mapWrap.appendChild(routePaced(pts));
  }
  card.appendChild(mapWrap);
  const ds=el("div",{class:"dstats"});
  [["Distance",fmtKm(a.distanceKm)],["Duration",fmtDur(a.durationSec)],["Avg pace",fmtPace(a.avgPaceSecPerKm)]]
    .forEach(([l,val])=>ds.appendChild(el("div",null,el("div",{class:"v"},val),el("div",{class:"l"},l))));
  card.appendChild(ds);
  const delRow=el("div",{class:"row-actions",style:{marginTop:"14px"}});
  if(state.confirmDel===a.id){
    delRow.appendChild(el("span",{style:{fontSize:"12px",color:C.muted,marginRight:"auto",alignSelf:"center"}},
      "Delete this activity everywhere?"));
    delRow.appendChild(el("button",{class:"btn",onclick:()=>{state.confirmDel=null;render();}},"Cancel"));
    delRow.appendChild(el("button",{class:"btn",style:{background:C.clay,color:"#fff",borderColor:C.clay},
      onclick:()=>deleteActivity(a.id)},"Delete"));
  }else{
    delRow.appendChild(el("button",{class:"btn",style:{color:C.clay},
      onclick:()=>{state.confirmDel=a.id;render();}},"Delete this activity"));
  }
  card.appendChild(delRow);
  v.appendChild(card);

  const mg=el("div",{class:"metgrid"});
  if(a.avgCadence)mg.appendChild(metric("Cadence",a.avgCadence+" spm",
    `peak ${a.maxCadence} · ${a.avgCadence>=170?"inside the efficient band":"below the usual 170–180"}`));
  if(a.avgStepLen)mg.appendChild(metric("Step length",a.avgStepLen+" m","ground covered per step"));
  if(a.avgPower)mg.appendChild(metric("Power",a.avgPower+" W",`peak ${a.maxPower} W`));
  if(a.avgHR)mg.appendChild(metric("Heart rate",a.avgHR+" bpm",`peak ${a.maxHR} bpm`));
  if(a.efficiencyIndex)mg.appendChild(metric("Efficiency index",a.efficiencyIndex,"metres per heartbeat"));
  if(a.decouplingPct!=null)mg.appendChild(metric("Aerobic decoupling",a.decouplingPct+"%",
    Math.abs(a.decouplingPct)<5?"under 5% — effort held steady":"over 5% — pace faded against heart rate"));
  if(a.negSplitSec!=null)mg.appendChild(metric("Second half",
    (a.negSplitSec>0?"−":"+")+fmtPaceShort(Math.abs(a.negSplitSec)),
    a.negSplitSec>0?"negative split — finished faster":"positive split — slowed down"));
  if(a.elevGainM!=null)mg.appendChild(metric("Elevation gain",Math.round(a.elevGainM)+" m",
    a.distanceKm?`${(a.elevGainM/a.distanceKm).toFixed(1)} m per km`:null));
  if(a.calories!=null)mg.appendChild(metric("Energy",a.calories+" kcal",null));
  if(a.stoppedSec)mg.appendChild(metric("Stopped",fmtDur(a.stoppedSec),
    `moving time ${fmtDur(a.durationSec)} — pace excludes this`));
  if(mg.children.length)v.appendChild(cardWith("Running dynamics",null,mg,
    el("p",{class:"cap"},"Vertical oscillation, vertical ratio and ground contact time aren't here — Garmin writes those only to FIT files, not TCX.")));

  if(!pts.length){
    v.appendChild(el("div",{class:"card muted-note"},
      "Detailed track data isn't stored for this one — re-upload its file to see the streams."));
    return v;
  }
  const ds2=downsample(pts,200);
  const ele=ds2.filter(p=>p.a!=null&&p.d!=null);
  if(ele.length>1)v.appendChild(cardWith("Elevation",`${a.elevGainM||0} m gain`,
    lineChart(ele.map(p=>({label:p.d.toFixed(1),v:p.a})),
      {color:C.slate,fill:C.slateL,h:120,dots:false,fmt:v=>Math.round(v)+" m"})));
  const hr=ds2.filter(p=>p.h!=null&&p.d!=null);
  if(hr.length>1)v.appendChild(cardWith("Heart rate",`avg ${a.avgHR} bpm`,
    lineChart(hr.map(p=>({label:p.d.toFixed(1),v:p.h})),
      {color:C.plum,h:120,dots:false,fmt:v=>Math.round(v)+" bpm"}),
    histogram(pts.map(p=>p.h),{color:C.plum,h:80,fmt:v=>Math.round(v)+""}),
    el("p",{class:"cap"},"The strip below shows how much of the run sat at each heart rate.")));
  const cad=ds2.filter(p=>p.c!=null&&p.c>0&&p.d!=null);
  if(cad.length>1)v.appendChild(cardWith("Cadence",`avg ${a.avgCadence} spm`,
    lineChart(cad.map(p=>({label:p.d.toFixed(1),v:p.c})),
      {color:C.teal,h:120,dots:false,fmt:v=>Math.round(v)+" spm",band:[170,180]}),
    el("p",{class:"cap"},"Shaded band is the 170–180 spm range most runners are efficient in.")));
  const pw=ds2.filter(p=>p.w!=null&&p.w>0&&p.d!=null);
  if(pw.length>1)v.appendChild(cardWith("Power",`avg ${a.avgPower} W`,
    lineChart(pw.map(p=>({label:p.d.toFixed(1),v:p.w})),
      {color:C.amber,h:120,dots:false,fmt:v=>Math.round(v)+" W"}),
    histogram(pts.map(p=>p.w).filter(x=>x!=null&&x>0),{color:C.amber,h:80,fmt:v=>Math.round(v)+""}),
    el("p",{class:"cap"},"Power tracks effort directly, where pace gets distorted by hills and wind.")));

  const sp=splitsOf(pts);
  if(sp.length){
    const full=sp.filter(x=>!x.partial);
    const avg=full.length?mean(full.map(x=>x.sec)):0;
    v.appendChild(cardWith("Kilometre splits",`avg ${fmtPaceShort(avg)}/km`,
      lollipop(sp.map(x=>({label:x.label,v:x.sec,
        tip:[`Km ${x.label} · ${fmtPaceShort(x.sec)}/km`,
             x.hr?`${Math.round(x.hr)} bpm`:null,
             x.cad?`${Math.round(x.cad)} spm`:null,
             x.pw?`${Math.round(x.pw)} W`:null,
             x.elev?`+${x.elev} m`:null].filter(Boolean).join("\n")})),
        {fmt:v=>fmtPaceShort(v),refLine:avg,colorOf:it=>it.v<avg?C.teal:C.clay}),
      el("p",{class:"cap"},"Dotted line is this run's average. Teal beat it, clay didn't. Tap a dot for that kilometre's heart rate, cadence and power.")));
  }
  return v;
}

/* ===========================================================================
   NEXT RUN — suggestions derived only from the last three activities.
   Every rule states the number it fired on, so nothing is asserted that the
   data doesn't show. Rules score themselves; the five strongest are shown.
   =========================================================================== */
const COACH_WINDOW=3;

function splitStats(points){
  const sp=splitsOf(points).filter(x=>!x.partial);
  if(sp.length<3)return null;
  const paces=sp.map(x=>x.sec);
  const m=mean(paces);
  const sd=Math.sqrt(mean(paces.map(v=>(v-m)*(v-m))));
  return {mean:m,sd,n:sp.length,first:paces[0],paces};
}

function coachRules(recent){
  const out=[];
  const withCad=recent.filter(a=>a.avgCadence);
  const withHR=recent.filter(a=>a.avgHR);
  const withDec=recent.filter(a=>a.decouplingPct!=null);
  const withNeg=recent.filter(a=>a.negSplitSec!=null);
  const withEf=recent.filter(a=>a.efficiencyIndex!=null);
  const n=recent.length;

  /* 1. Cadence — the single most changeable form variable */
  if(withCad.length){
    const cad=mean(withCad.map(a=>a.avgCadence));
    if(cad<170){
      out.push({score:(170-cad)*3+20,tag:"Cadence",
        finding:`Your last ${withCad.length} run${withCad.length===1?"":"s"} averaged ${Math.round(cad)} steps per minute.`,
        action:`Try holding about ${Math.round(cad)+5} spm on your next easy run — quicker, lighter steps rather than reaching further forward. Most runners find 170–180 easiest on the joints.`});
    }else if(cad>190){
      out.push({score:15,tag:"Cadence",
        finding:`You're averaging ${Math.round(cad)} spm, above the usual band.`,
        action:"That's not a problem in itself, but if it feels frantic rather than springy, let your stride open slightly on flat sections."});
    }
  }

  /* 2. Pacing — did the second half fade? */
  if(withNeg.length>=2){
    const neg=mean(withNeg.map(a=>a.negSplitSec));
    if(neg<-8){
      out.push({score:Math.min(Math.abs(neg),60)+30,tag:"Pacing",
        finding:`On average your second half ran ${fmtPaceShort(Math.abs(neg))}/km slower than your first.`,
        action:`Start your next run deliberately slower — around ${fmtPaceShort(Math.abs(neg))}/km easier than target for the first 2 km. Finishing level or faster usually gives a quicker overall time.`});
    }else if(neg>8){
      out.push({score:12,tag:"Pacing",
        finding:`You're finishing faster than you start, by ${fmtPaceShort(neg)}/km on average.`,
        action:"Good pacing discipline. There's room to start a little quicker if you're chasing a time."});
    }
  }

  /* 3. Effort control within a run */
  if(withDec.length){
    const dec=mean(withDec.map(a=>a.decouplingPct));
    if(dec>5){
      out.push({score:dec*4+18,tag:"Endurance",
        finding:`Speed per heartbeat dropped ${dec.toFixed(1)}% between the first and second half — anything above 5% means the effort got harder to hold.`,
        action:"Run the next one at a pace you could hold a conversation at the whole way. Decoupling usually falls as aerobic base builds, and it also rises in heat."});
    }
  }

  /* 4. Even pacing inside the run */
  const stats=recent.map(a=>splitStats(loadPoints(a.id)||[])).filter(Boolean);
  if(stats.length){
    const sd=mean(stats.map(x=>x.sd));
    if(sd>18){
      out.push({score:sd+14,tag:"Consistency",
        finding:`Your kilometre splits swing by about ${fmtPaceShort(sd)}/km either side of your average.`,
        action:"Pick one run and hold a single pace for every kilometre, checking your watch at each split. Steady beats surging for the same effort."});
    }
    const fastStarts=stats.filter(x=>x.first<x.mean-12).length;
    if(fastStarts>=2){
      out.push({score:34,tag:"Fast starts",
        finding:`Your first kilometre was well quicker than your average in ${fastStarts} of the last ${stats.length} runs.`,
        action:"Treat the first kilometre as a warm-up and let it be your slowest. It usually makes the rest feel easier."});
    }
  }

  /* 5. Are all runs sitting at the same intensity? */
  if(withHR.length>=3){
    const hrs=withHR.map(a=>a.avgHR);
    const spread=Math.max(...hrs)-Math.min(...hrs);
    const peak=Math.max(...state.index.map(a=>a.maxHR||0));
    const avg=mean(hrs);
    if(spread<8&&peak&&avg>peak*0.82){
      out.push({score:32,tag:"Variety",
        finding:`All ${withHR.length} runs sat within ${spread} bpm of each other, around ${Math.round(avg)} bpm.`,
        action:"Everything is landing at one moderate intensity. Making one run properly easy — and letting another be genuinely hard — tends to work better than three at the same effort."});
    }
  }

  /* 6. Efficiency trend across the window */
  if(withEf.length>=3){
    const asc=[...withEf].sort((a,b)=>new Date(a.startTime)-new Date(b.startTime));
    const drop=(asc[0].efficiencyIndex-asc[asc.length-1].efficiencyIndex)/asc[0].efficiencyIndex*100;
    if(drop>6){
      out.push({score:drop*2+16,tag:"Recovery",
        finding:`Metres per heartbeat fell ${drop.toFixed(0)}% across these ${asc.length} runs.`,
        action:"Covering less ground per beat often just means accumulated tiredness. An easy day or a rest day before the next quality run is usually the fastest way forward."});
    }
  }

  /* 7. Training load — flagged gently, this is the one that risks injury */
  {
    const all=[...state.index].sort((a,b)=>new Date(b.startTime)-new Date(a.startTime));
    if(all.length>COACH_WINDOW+2){
      const recentKm=recent.reduce((s,a)=>s+a.distanceKm,0)/recent.length;
      const older=all.slice(COACH_WINDOW,COACH_WINDOW+5);
      const olderKm=older.reduce((s,a)=>s+a.distanceKm,0)/older.length;
      if(olderKm>0&&recentKm/olderKm>1.35){
        out.push({score:38,tag:"Load",
          finding:`Your recent runs average ${fmtKm(recentKm,1)} against ${fmtKm(olderKm,1)} before — a jump of ${Math.round((recentKm/olderKm-1)*100)}%.`,
          action:"Sharp jumps in distance are where niggles tend to start. Holding this distance for a couple of runs before going longer is the safer way to keep the gains."});
      }
    }
  }

  /* 8. Step length against cadence — overstriding proxy */
  const withStep=recent.filter(a=>a.avgStepLen&&a.avgCadence);
  if(withStep.length){
    const st=mean(withStep.map(a=>a.avgStepLen));
    const cd=mean(withStep.map(a=>a.avgCadence));
    if(cd<172&&st>1.25){
      out.push({score:26,tag:"Stride",
        finding:`Long steps (${st.toFixed(2)} m) at a low turnover (${Math.round(cd)} spm).`,
        action:"That combination usually means landing with the foot ahead of your hips. Same speed, more steps — aim to land underneath yourself."});
    }
  }

  /* 9. Terrain variety */
  const withEl=recent.filter(a=>a.elevGainM!=null&&a.distanceKm>0);
  if(withEl.length>=3){
    const perKm=mean(withEl.map(a=>a.elevGainM/a.distanceKm));
    if(perKm<4){
      out.push({score:11,tag:"Terrain",
        finding:`These runs averaged ${perKm.toFixed(1)} m of climb per kilometre — essentially flat.`,
        action:"A route with some hills, or a few short uphill efforts, builds strength that flat running doesn't. Worth one run in the next few."});
    }
  }

  /* 10. Power steadiness, when the watch records it */
  const withPw=recent.filter(a=>a.avgPower&&a.maxPower);
  if(withPw.length>=2){
    const ratio=mean(withPw.map(a=>a.maxPower/a.avgPower));
    if(ratio>1.5){
      out.push({score:17,tag:"Power",
        finding:`Peak power ran ${Math.round((ratio-1)*100)}% above your average — the effort came in bursts.`,
        action:"Spikes cost more than they gain on steady runs. Easing over rises and rolling the descents keeps output flatter for the same pace."});
    }
  }
  return out.sort((a,b)=>b.score-a.score).slice(0,5);
}

function viewYear(){
  const v=el("div",{class:"view"});
  const ys=years();
  if(!ys.length){v.appendChild(el("div",{class:"card muted-note"},"No activities to summarise yet."));return v;}
  if(state.year==null||!ys.includes(state.year))state.year=ys[0];
  const wrap=el("div",{class:"sel-wrap"});
  const sel=el("select",{class:"sel",onchange:e=>{state.year=parseInt(e.target.value,10);render();}});
  ys.forEach(y=>{const o=el("option",{value:y},String(y));if(y===state.year)o.selected=true;sel.appendChild(o);});
  wrap.appendChild(sel);v.appendChild(wrap);

  const list=filtered().filter(a=>new Date(a.startTime).getFullYear()===state.year);
  const km=list.reduce((s,a)=>s+a.distanceKm,0);
  const dur=list.reduce((s,a)=>s+a.durationSec,0);
  const elev=list.reduce((s,a)=>s+(a.elevGainM||0),0);
  const kcal=list.reduce((s,a)=>s+(a.calories||0),0);

  const g=el("div",{class:"grid2"});
  g.appendChild(statCard("Total distance",fmtKm(km,1),C.clay,
    list.length?`${(km/list.length).toFixed(1)} km average`:null));
  g.appendChild(statCard("Total time",fmtDur(dur),C.slate));
  g.appendChild(statCard("Elevation gain",elev?Math.round(elev)+" m":"—",C.teal));
  g.appendChild(statCard("Activities",String(list.length),C.charcoal,kcal?`${kcal} kcal`:null));
  v.appendChild(g);

  const mg=el("div",{class:"metgrid"});
  const paces=list.map(a=>a.avgPaceSecPerKm).filter(x=>x!=null);
  if(paces.length)mg.appendChild(metric("Average pace",fmtPace(mean(paces)),`over ${paces.length} activities`));
  const hrs=list.map(a=>a.avgHR).filter(x=>x!=null);
  if(hrs.length)mg.appendChild(metric("Average HR",Math.round(mean(hrs))+" bpm",null));
  const cads=list.map(a=>a.avgCadence).filter(x=>x!=null);
  if(cads.length)mg.appendChild(metric("Average cadence",Math.round(mean(cads))+" spm",null));
  const pws=list.map(a=>a.avgPower).filter(x=>x!=null);
  if(pws.length)mg.appendChild(metric("Average power",Math.round(mean(pws))+" W",null));
  const efs=list.map(a=>a.efficiencyIndex).filter(x=>x!=null);
  if(efs.length)mg.appendChild(metric("Efficiency index",mean(efs).toFixed(2),"metres per heartbeat"));
  const sls=list.map(a=>a.avgStepLen).filter(x=>x!=null);
  if(sls.length)mg.appendChild(metric("Step length",mean(sls).toFixed(2)+" m",null));
  const wks=new Set(list.map(a=>{const d=new Date(a.startTime);
    d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10);})).size;
  if(wks)mg.appendChild(metric("Active weeks",String(wks),`${(km/wks).toFixed(1)} km per active week`));
  if(mg.children.length)v.appendChild(cardWith(`${state.year} averages`,null,mg));

  v.appendChild(cardWith("Month by month","size = distance",
    monthBubbles(monthlyOf(filtered(),state.year),{
      tip:m=>`${m.label} ${state.year}\n${fmtKm(m.km,1)} · ${m.n} activit${m.n===1?"y":"ies"}\n${fmtDur(m.sec)}`}),
    el("p",{class:"cap"},"Bubble size is distance; colour is the dominant activity type that month.")));

  const asc=[...list].sort((a,b)=>new Date(a.startTime)-new Date(b.startTime));
  if(asc.length>1){
    let run=0;
    const cum=asc.map(a=>{run+=a.distanceKm;return {label:fmtDateShort(a.startTime),v:+run.toFixed(1)};});
    v.appendChild(cardWith("Cumulative distance",fmtKm(km,0),
      lineChart(cum,{color:C.clay,fill:C.clayL,h:150,dots:false,fmt:v=>v.toFixed(0)+" km"})));
  }

  const groups=placesOf(list);
  if(groups.length)v.appendChild(cardWith(`Where you ran in ${state.year}`,null,placesBlock(groups)));

  if(list.length){
    const longest=[...list].sort((a,b)=>b.distanceKm-a.distanceKm)[0];
    const runs=list.filter(a=>a.sport===RUN&&a.avgPaceSecPerKm);
    const fastest=runs.length?[...runs].sort((a,b)=>a.avgPaceSecPerKm-b.avgPaceSecPerKm)[0]:null;
    const longT=[...list].sort((a,b)=>b.durationSec-a.durationSec)[0];
    const climb=[...list].filter(a=>a.elevGainM).sort((a,b)=>b.elevGainM-a.elevGainM)[0];
    const bestEf=[...list].filter(a=>a.efficiencyIndex!=null).sort((a,b)=>b.efficiencyIndex-a.efficiencyIndex)[0];
    const items=[["Longest distance",fmtKm(longest.distanceKm,1),fmtDateShort(longest.startTime)]];
    if(fastest)items.push(["Fastest pace",fmtPace(fastest.avgPaceSecPerKm),fmtDateShort(fastest.startTime)]);
    items.push(["Longest duration",fmtDur(longT.durationSec),fmtDateShort(longT.startTime)]);
    if(climb)items.push(["Biggest climb",Math.round(climb.elevGainM)+" m",fmtDateShort(climb.startTime)]);
    if(bestEf)items.push(["Best efficiency",bestEf.efficiencyIndex.toFixed(2),fmtDateShort(bestEf.startTime)]);
    const grid=el("div",{class:"prgrid"});
    items.forEach(([l,val,sub])=>grid.appendChild(el("div",{class:"pr"},
      el("div",{class:"v"},val),el("div",{class:"l"},l),el("div",{class:"s"},sub))));
    v.appendChild(cardWith(`Best of ${state.year}`,null,grid));
  }

  const by={Running:0,Walking:0,Biking:0,Other:0};
  list.forEach(a=>by[a.sport]+=a.distanceKm);
  const tot=Object.values(by).reduce((a,b)=>a+b,0);
  if(tot>0&&Object.values(by).filter(x=>x>0).length>1){
    const bar=el("div",{class:"splitbar"});
    SPORT_ORDER.forEach(k=>{if(by[k]>0)bar.appendChild(el("div",{style:{width:(by[k]/tot*100)+"%",background:SPORT_COLOR[k]}}));});
    const leg=el("div",{class:"legend"});
    SPORT_ORDER.forEach(k=>{if(by[k]>0)leg.appendChild(el("span",null,
      el("i",{style:{background:SPORT_COLOR[k]}}),`${k} ${fmtKm(by[k],1)}`));});
    v.appendChild(cardWith("Split by activity",null,bar,leg));
  }
  return v;
}

/* Runs each Dropbox call in turn so a failure can be pinned to a step rather
   than reported as a blanket "couldn't reach Dropbox". */
async function dbxDiagnose(){
  const out=[];
  const note=(step,ok,msg)=>{out.push({step,ok,msg});state.diag=out.slice();render();};
  state.diag=[{step:"Running checks…",ok:null}];state.diagDone=false;render();
  try{
    await fetch("https://www.dropbox.com/favicon.ico",{mode:"no-cors",cache:"no-store"});
    note("Reaching dropbox.com",true);
  }catch(e){
    note("Reaching dropbox.com",false,
      "The browser couldn't reach Dropbox at all. A content blocker, VPN, private relay or strict tracking protection will do this — try disabling content blockers for this site, or another network.");
    state.diagDone=true;render();return;
  }
  let tok=null;
  try{ tok=await dbxAccessToken(); note("Renewing sign-in",true); }
  catch(e){ note("Renewing sign-in",false,e.message); state.diagDone=true;render(); return; }
  try{
    const r=await fetch("https://content.dropboxapi.com/2/files/download",{method:"POST",
      headers:{Authorization:"Bearer "+tok,"Dropbox-API-Arg":JSON.stringify({path:DBX_MANIFEST})}});
    if(r.ok||r.status===409)note("Reading from Dropbox",true,
      r.status===409?"No manifest there yet — normal before the first sync.":"");
    else note("Reading from Dropbox",false,dbxError(r.status,await r.text().catch(()=>""),"download").message);
  }catch(e){ note("Reading from Dropbox",false,"The request never completed — usually a content blocker or network filter."); }
  try{
    const r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",
      headers:{Authorization:"Bearer "+tok,
        "Dropbox-API-Arg":JSON.stringify({path:"/.connection-check.json",mode:"overwrite",mute:true}),
        "Content-Type":"application/octet-stream"},
      body:JSON.stringify({checkedAt:new Date().toISOString()})});
    if(r.ok){note("Writing to Dropbox",true); dbxDelete("/.connection-check.json");}
    else note("Writing to Dropbox",false,dbxError(r.status,await r.text().catch(()=>""),"upload").message);
  }catch(e){ note("Writing to Dropbox",false,"The request never completed — usually a content blocker or network filter."); }
  /* Sync writes into /activities/, and a subfolder can fail where the root
     succeeds, so check that separately — the previous check missed it. */
  try{
    const r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",
      headers:{Authorization:"Bearer "+tok,
        "Dropbox-API-Arg":JSON.stringify({path:"/activities/.connection-check.json",mode:"overwrite",mute:true}),
        "Content-Type":"application/octet-stream"},
      body:JSON.stringify({checkedAt:new Date().toISOString()})});
    if(r.ok){note("Writing into the activities folder",true); dbxDelete("/activities/.connection-check.json");}
    else note("Writing into the activities folder",false,dbxError(r.status,await r.text().catch(()=>""),"upload").message);
  }catch(e){ note("Writing into the activities folder",false,"The request never completed."); }
  /* A realistically sized body — a small one can succeed where 140 KB fails. */
  try{
    const big={pad:"x".repeat(150000)};
    const r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",
      headers:{Authorization:"Bearer "+tok,
        "Dropbox-API-Arg":JSON.stringify({path:"/activities/.size-check.json",mode:"overwrite",mute:true}),
        "Content-Type":"application/octet-stream"},
      body:JSON.stringify(big)});
    if(r.ok){note("Uploading a full-size activity",true); dbxDelete("/activities/.size-check.json");}
    else note("Uploading a full-size activity",false,dbxError(r.status,await r.text().catch(()=>""),"upload").message);
  }catch(e){ note("Uploading a full-size activity",false,"The request never completed — a proxy or filter may be blocking larger uploads."); }
  state.diagDone=true;render();
}

  ta.addEventListener("paste",e=>{
    const f=e.clipboardData&&e.clipboardData.files&&e.clipboardData.files[0];
    if(f){e.preventDefault();handleFiles([f]);state.showPaste=false;render();}
  });
  ta.addEventListener("dragover",e=>e.preventDefault());
  ta.addEventListener("drop",e=>{
    e.preventDefault();
    const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f){handleFiles([f]);state.showPaste=false;render();}
  });
  card.appendChild(ta);
  card.appendChild(el("div",{class:"row-actions"},
    el("button",{class:"btn",onclick:()=>{state.showPaste=false;render();}},"Cancel"),
    el("button",{class:"btn btn-primary",onclick:()=>{
      const t=ta.value.trim(); if(!t)return;
      importEntries([{name:"pasted-activity",text:t}]); state.showPaste=false;
    }},"Import")));
  host.appendChild(card);
}
function renderChips(){
  const host=$("chips"); host.innerHTML="";
  const present=Array.from(new Set(state.index.map(a=>a.sport)));
  if(present.length<2)return;
  const row=el("div",{class:"chip-row"});
  row.appendChild(el("button",{class:"chip"+(state.sportFilter==="all"?" active":""),
    onclick:()=>{state.sportFilter="all";render();}},"All"));
  SPORT_ORDER.filter(s=>present.includes(s)).forEach(s=>{
    row.appendChild(el("button",{class:"chip"+(state.sportFilter===s?" active":""),
      onclick:()=>{state.sportFilter=s;render();}},s));
  });
  host.appendChild(row);
}
function renderTabs(){
  const host=$("tabbar"); host.innerHTML="";
  TABS.forEach(([k,l])=>{
    host.appendChild(el("button",{class:"tab"+(state.tab===k?" active":""),
      onclick:()=>{state.tab=k;render();}},l));
  });
}
function renderEmpty(){
  return el("div",{class:"empty"},
    el("h2",null,"No activities yet"),
    el("p",null,"Export a TCX from Garmin Connect (open an activity → gear icon → Export to TCX) and upload it here. Connect Dropbox and everything syncs across your devices automatically."),
    el("label",{class:"btn btn-primary",for:"fileInput"},"Upload activities"),
    el("button",{class:"link-btn",style:{marginTop:"6px"},onclick:()=>{state.showDbx=true;render();}},"Connect Dropbox"));
}

function render(){
  $("btnExport").hidden=!state.index.length;
  $("btnClear").hidden=!state.index.length;
  $("btnClear").className="icon-btn"+(state.showClear?" danger":"");
  $("btnClear").title="Clear data";
  renderClearPanel();
  renderSyncBar(); renderToast(); renderDupes(); renderPending(); renderDbxPanel(); renderPastePanel(); renderChips(); renderTabs();
  const main=$("main"); main.innerHTML="";
  if(!state.index.length&&!state.pending.length&&!state.dupes.length){ main.appendChild(renderEmpty()); return; }
  if(state.tab==="overview")main.appendChild(viewOverview());
  else if(state.tab==="trends")main.appendChild(viewTrends());
  else if(state.tab==="detail")main.appendChild(viewDetail());
  else if(state.tab==="next")main.appendChild(viewNextRun());
  else main.appendChild(viewYear());
}

/* ---------------- wire-up ---------------- */
$("fileInput").addEventListener("change",e=>{handleFiles(e.target.files);e.target.value="";});
$("btnExport").addEventListener("click",exportBackup);
function renderClearPanel(){
  const host=$("clearPanel"); if(!host)return;
  host.innerHTML="";
  if(!state.showClear)return;
  const n=state.index.length;
  const card=el("div",{class:"panel alert"});
  card.appendChild(el("p",{class:"sub"},
    `${n} activit${n===1?"y":"ies"} on this device. Two different things you might mean:`));
  card.appendChild(el("div",{class:"row-actions left",style:{flexDirection:"column",alignItems:"stretch"}},
    el("button",{class:"btn",onclick:()=>exportBackup()},"Export a backup first"),
    el("button",{class:"btn",onclick:resetDevice},
      state.dbx.refresh?"Reset this device (Dropbox keeps everything)":"Clear this device"),
    el("button",{class:"btn",style:{background:C.clay,color:"#fff",borderColor:C.clay},
      onclick:deleteEverything},"Delete everything, everywhere"),
    el("button",{class:"link-btn",style:{marginTop:"4px"},
      onclick:()=>{state.showClear=false;render();}},"Cancel")));
  if(state.dbx.refresh)card.appendChild(el("p",{class:"cap"},
    "Reset clears only this device — the next sync pulls everything back from Dropbox. Delete everywhere also removes it from Dropbox and any other device."));
  host.appendChild(card);
}
$("btnClear").addEventListener("click",()=>{state.showClear=!state.showClear;render();});
$("linkDbx").addEventListener("click",()=>{state.showDbx=!state.showDbx;render();});
$("linkPaste").addEventListener("click",()=>{state.showPaste=!state.showPaste;render();});

/* Handle the OAuth redirect coming back from Dropbox */
(async function boot(){
  loadLocal();
  const params=new URLSearchParams(window.location.search);
  const code=params.get("code");
  if(code){
    try{
      await dbxExchangeCode(code);
      history.replaceState({},"",redirectUri());
      state.dbx.account=await dbxAccount().catch(()=>null);
      saveDbx();
      state.showDbx=false;
      render();
      await syncNow();
      queueGeocode();
    }catch(e){
      state.showDbx=true;
      state.dbxStatus={ok:false,text:e.message||"Could not complete Dropbox sign-in."};
      history.replaceState({},"",redirectUri());
      render();
    }
    return;
  }
  if(params.get("error")){
    state.showDbx=true;
    state.dbxStatus={ok:false,text:"Dropbox sign-in was cancelled or refused ("+params.get("error")+")."};
    history.replaceState({},"",redirectUri());
  }
  render();
  if(state.dbx.refresh) syncNow();
  queueGeocode();
})();
</script>
</body>
